# GitHub Actions：PR 时自动生成乐谱对照
#
# 做三件事：
#   ① 把基准版本 checkout 到 _base/
#   ② 跑 scripts/ci-preview.mjs → 语义 diff + 只渲染改动的小节（PNG + MP3）
#   ③ 把结果当评论贴回 PR
#
# ── 关于 MuseScore 的版本（踩过的坑，别改回去）────────────────────
#
# Ubuntu 24.04 的 apt 里**只有 v2 和 v3**：
#   musescore   2.3.2
#   musescore3  3.2.3
#   （没有 musescore4）
#
# 而 MuseScore 4 存的 .mscx 是 version="4.50"/"4.60"，**MuseScore 3 打不开**。
# 所以 `apt install musescore3` 会装上一个读不了你乐谱的程序 —— workflows 显示
# 成功，实际每次都静默失败。只能用 v4 的 AppImage。
#
# ── 关于无头环境 ──────────────────────────────────────────────────
#
# MuseScore 是 Qt 应用，需要 X display。CI 上没有显示器，会报
#   "qt.qpa.xcb: could not connect to display"
# 所以要 xvfb-run 包一层。MuseScore 官方论坛确认：他们自己的 CI 就是这么做的。

name: 乐谱改动预览

on:
  pull_request:
    paths:
      - 'pieces/**/*.mscx'
      - 'scripts/**'
      - '.github/workflows/score-preview.yml'
  workflow_dispatch: # 允许手动触发（第一次验证用）

permissions:
  # ⚠️ contents 必须是 write —— 「贴回 PR」那一步用 `gh pr comment --attach`
  #    上传图片和视频，而 --attach 要求对仓库有 push 权限。
  #    只给 read 的话附件上传会失败，评论里的媒体就出不来。
  contents: write
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: 取提交版本
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 算基准 SHA
        id: base
        run: |
          # PR：跟目标分支的基线比
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            sha="${{ github.event.pull_request.base.sha }}"
          # 手动触发：跟上一次提交比；只有一个提交时跟自己比（会得到"没有改动"）
          elif git rev-parse HEAD~1 >/dev/null 2>&1; then
            sha="$(git rev-parse HEAD~1)"
          else
            sha="$(git rev-parse HEAD)"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "基准：$sha"

      - name: 取基准版本
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.base.outputs.sha }}
          path: _base

      - name: 装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ── MuseScore 拆成四步 ────────────────────────────────────────
      #
      # 原来是一大坨，失败时看不出卡在哪。拆开之后日志直接告诉你哪一步挂了。
      # 每步都 continue-on-error：MuseScore 只是"锦上添花"（出图和音频），
      # 文字 diff 不需要它 —— 装不上不该让整个 PR 变红。
      #
      # ⚠️ 已知坑：https://musescore.org/en/download/musescore-x86_64.AppImage
      #    返回的是 **HTML 跳转页**（content-type: text/html），不是文件。
      #    直接 curl 会下到 25 KB 的 HTML，chmod +x 也照样成功，
      #    直到 --appimage-extract 才失败 —— 报错完全看不出原因。
      #    真地址要从那个页面里解析。
      #
      # ⚠️ Ubuntu 24.04 的 apt 里只有 musescore(2.3.2) / musescore3(3.2.3)，
      #    而 MuseScore 4 存的 .mscx 是 version 4.50/4.60，**v3 打不开**。
      #    官方 PPA 在 noble 上也只有 2.3.2。所以只能用 v4 的 AppImage。

      - name: MuseScore ① 装 Xvfb + 运行库
        continue-on-error: true
        run: |
          set -x
          sudo apt-get update -qq

          # ⚠️ 踩过的坑：AppImage 里不含系统运行库，缺一个就整个起不来。
          #    上一次的报错：
          #      mscore4portable: error while loading shared libraries: libEGL.so.1
          #    AppRun 对 libOpenGL / libjack / libpipewire 有自带 fallback，
          #    但 libEGL.so.1 没有 —— 缺它就直接 127。
          #
          #    逐个装而不是一次性列一堆：多包安装时只要有一个包名不存在，
          #    整条命令失败、一个都装不上。逐个装能把失败限制在单个包。
          #    包名按 Ubuntu 24.04 (noble) 的实际提供方查过；
          #    带 t64 后缀的是 24.04 的时间戳迁移改名，老版本不带后缀所以两种都试。
          for p in \
            xvfb xauth \
            libegl1 libopengl0 libgl1 libglx-mesa0 libgbm1 \
            libjack-jackd2-0 libjack0 \
            libpipewire-0.3-0t64 libpipewire-0.3-0 \
            libxkbcommon0 libxkbcommon-x11-0 libnss3 \
            libasound2t64 libasound2 \
            libfontconfig1 libfreetype6 \
            libxcb1 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxi6 libxcursor1 \
            libsm6 libice6 libdrm2 libglx0 ; do
            sudo apt-get install -y -qq "$p" >/dev/null 2>&1 \
              && printf "  ✅ %s\n" "$p" \
              || printf "  ⚠️  %s 装不上（可能包名不同，跳过）\n" "$p"
          done

          which xvfb-run Xvfb xauth
          echo "--- 装完了 ---"

      - name: MuseScore ② 下载 AppImage
        continue-on-error: true
        run: |
          set -x
          JUMP="https://musescore.org/en/download/musescore-x86_64.AppImage"
          URL=$(curl -sL --max-time 60 "$JUMP" 2>/dev/null \
                | grep -oE 'https://github\.com/musescore/MuseScore/releases/download/[^"'"'"' <>]+x86_64\.AppImage' \
                | head -1 || true)

          if [ -z "$URL" ]; then
            echo "::warning::解析不到最新 AppImage 地址，用兜底的固定版本"
            URL="https://github.com/musescore/MuseScore/releases/download/v4.7.5/MuseScore-Studio-4.7.5.260831071-x86_64.AppImage"
          fi
          echo "AppImage 地址：$URL"

          curl -L --retry 3 --retry-delay 5 --max-time 900 -o /tmp/MuseScore.AppImage "$URL"
          ls -la /tmp/MuseScore.AppImage

          # 校验必须是 ELF。这一条能直接抓住"下到 HTML"的情况。
          MAGIC=$(head -c 4 /tmp/MuseScore.AppImage | od -An -tx1 | tr -d ' \n')
          echo "前 4 字节：$MAGIC"
          if [ "$MAGIC" != "7f454c46" ]; then
            echo "::error::下载到的不是 AppImage（前 4 字节 $MAGIC，应为 7f454c46）"
            head -c 300 /tmp/MuseScore.AppImage
            exit 1
          fi

      - name: MuseScore ③ 解包并装 mscore
        continue-on-error: true
        run: |
          set -x
          chmod +x /tmp/MuseScore.AppImage
          cd /tmp
          /tmp/MuseScore.AppImage --appimage-extract
          ls -la /tmp/squashfs-root/AppRun

          # 包装成 PATH 上的 mscore —— 本地和 CI 用同一个名字，
          # ci-preview.mjs 的 findMuseScore() 按名字找得到。
          sudo tee /usr/local/bin/mscore > /dev/null <<'WRAP'
          #!/bin/sh
          exec xvfb-run -a /tmp/squashfs-root/AppRun "$@"
          WRAP
          sudo chmod +x /usr/local/bin/mscore
          cat /usr/local/bin/mscore

      - name: MuseScore ④ 查缺失依赖
        # ⚠️ 这一步是排错的关键：ldd 会**直接列出还缺哪些 .so**，
        #    不用再从「exit code 127」倒推。
        #    上一次就是靠运行日志里的
        #      mscore4portable: error while loading shared libraries: libEGL.so.1
        #    才定位到缺 libegl1。
        continue-on-error: true
        run: |
          set -x
          BIN=/tmp/squashfs-root/bin/mscore4portable
          ls -la "$BIN" || true

          echo "=== ldd 缺失的库 ==="
          ldd "$BIN" 2>&1 | grep -i "not found" || echo "（ldd 层面没有缺失）"

          echo "=== 主程序自带的库目录 ==="
          ls /tmp/squashfs-root/lib/ 2>/dev/null | head -20 || true

      - name: MuseScore ⑤ 自检
        continue-on-error: true
        run: |
          set -x
          mscore --version

      - name: 确认 MuseScore 可用性
        run: |
          if command -v mscore >/dev/null 2>&1 && mscore --version >/dev/null 2>&1; then
            echo "MuseScore 可用 → 会出对照谱图" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "MuseScore 不可用 → 本次只有文字 diff" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "缺失的库（来自 ldd）：" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            ldd /tmp/squashfs-root/bin/mscore4portable 2>&1 | grep -i "not found" >> "$GITHUB_STEP_SUMMARY" || echo "（ldd 无缺失，问题在别处）" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 生成对照
        id: gen
        #
        # 两种模式，看有没有配 OPENMUSE_PAT 这个 secret：
        #
        #   attach   —— 有 PAT。正文里写本地路径（--link-prefix out），
        #               下面用 `gh pr comment --attach` 上传并原地改写成
        #               附件 URL。图片内联 + 视频变播放器。
        #
        #   previews —— 没有 PAT。退回「推到 previews 分支 + raw URL」，
        #               图片能内联，但视频不行（raw mp4 不会渲染成播放器）。
        #
        # ⚠️ 为什么 attach 模式不能用 Actions 自带的 GITHUB_TOKEN：
        #    GITHUB_TOKEN 是 GitHub App 的 installation token（服务器间令牌），
        #    而 gh --attach 只认 user 类型的令牌（gho_ / ghp_ / github_pat_）。
        #    用 GITHUB_TOKEN 会直接报 "unsupported authentication type"。
        env:
          PAT: ${{ secrets.OPENMUSE_PAT }}
        run: |
          PR="${{ github.event.pull_request.number }}"
          if [ -n "$PAT" ]; then
            echo "模式：attach（有 OPENMUSE_PAT）"
            echo "mode=attach" >> "$GITHUB_OUTPUT"
            node scripts/ci-preview.mjs --base-dir _base --out out --link-prefix out
          elif [ -n "$PR" ]; then
            BASE="https://raw.githubusercontent.com/${{ github.repository }}/previews/pr-$PR"
            echo "模式：previews（没配 OPENMUSE_PAT）→ $BASE"
            echo "mode=previews" >> "$GITHUB_OUTPUT"
            node scripts/ci-preview.mjs --base-dir _base --out out --image-base "$BASE"
          else
            echo "模式：无（不是 PR）"
            echo "mode=none" >> "$GITHUB_OUTPUT"
            node scripts/ci-preview.mjs --base-dir _base --out out
          fi

      - name: 上传产出
        uses: actions/upload-artifact@v4
        with:
          name: score-preview
          path: out/
          retention-days: 14
          if-no-files-found: warn

      - name: 发布预览到 previews 分支（没有 PAT 时的退路）
        if: github.event_name == 'pull_request' && steps.gen.outputs.mode == 'previews'
        continue-on-error: true
        run: |
          set -e
          PR="${{ github.event.pull_request.number }}"

          # 先把产出挪出工作区 —— 下面切分支会把工作区换掉
          rm -rf /tmp/preview-stash && mkdir -p /tmp/preview-stash
          cp -r out/. /tmp/preview-stash/

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin previews >/dev/null 2>&1; then
            git fetch --depth=1 origin previews
            git checkout -B previews FETCH_HEAD
          else
            echo "previews 分支还不存在，新建孤儿分支"
            git checkout --orphan previews
            git rm -rf . >/dev/null 2>&1 || true
          fi

          rm -rf "pr-$PR"
          mkdir -p "pr-$PR"
          cp -r /tmp/preview-stash/. "pr-$PR/"
          printf 'out/\n' > .gitignore

          git add -A
          if git diff --cached --quiet; then
            echo "（内容没变，不提交）"
          else
            git commit -m "预览 pr-$PR"
            git push -f origin previews
          fi

          rm -rf out && mkdir -p out && cp -r /tmp/preview-stash/. out/

      - name: 贴回 PR（PAT + gh --attach）
        #
        # ⚠️ 为什么用 gh 而不是 REST API：
        #
        #   GitHub 的 Markdown 不能嵌音频播放器，也渲染不了仓库里的图片 ——
        #   除非文件是**通过评论附件上传的**。`gh pr comment --attach` 会
        #   把文件传到 GitHub 的附件存储，并**原地改写正文里的本地路径**
        #   成上传后的 URL，于是图片内联、视频变成播放器。
        #
        #   REST API 没有上传附件的接口，所以这件事只能靠 gh + PAT。
        #
        #   代价：gh pr comment 只能新建评论、不能改已有的。所以先删掉上一次
        #   那条（认 marker），再发新的 —— 这样 PR 里始终只有一条预览评论。
        #
        if: github.event_name == 'pull_request' && steps.gen.outputs.mode == 'attach' && hashFiles('out/report.md') != ''
        env:
          GH_TOKEN: ${{ secrets.OPENMUSE_PAT }}
        run: |
          set -e
          PR="${{ github.event.pull_request.number }}"
          REPO="${{ github.repository }}"

          echo "=== 删掉上一次的预览评论 ==="
          gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '.[] | select(.body | contains("<!-- openmuse-preview -->")) | .id' \
          | while read -r id; do
              if [ -n "$id" ]; then
                echo "  删除评论 $id"
                gh api -X DELETE "repos/$REPO/issues/comments/$id"
              fi
            done

          echo "=== 组装正文（加 marker 便于下次定位）==="
          printf '%s\n' '<!-- openmuse-preview -->' > /tmp/body.md
          cat out/report.md >> /tmp/body.md

          echo "=== 收集附件 ==="
          ARGS=()
          while IFS= read -r f || [ -n "$f" ]; do
            if [ -n "$f" ] && [ -f "$f" ]; then
              ARGS+=(--attach "$f")
              echo "  $f"
            fi
          done < out/attachments.txt

          COUNT=$(( ${#ARGS[@]} / 2 ))
          echo "共 $COUNT 个附件"
          gh pr comment "$PR" --body-file /tmp/body.md "${ARGS[@]}"

      - name: 贴回 PR（没有 PAT，退回 REST API）
        if: |
          github.event_name == 'pull_request'
          && steps.gen.outputs.mode != 'attach'
          && hashFiles('out/report.md') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const marker = '<!-- openmuse-preview -->'
            const body = fs.readFileSync('out/report.md', 'utf8')
            const full = marker + '\n' + body

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            })
            const mine = comments.find(c => c.body?.includes(marker))

            if (mine) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: mine.id, body: full,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body: full,
              })
            }
