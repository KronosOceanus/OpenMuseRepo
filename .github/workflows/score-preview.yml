# GitHub Actions：PR 时自动生成乐谱对照
#
# 做三件事：
#   ① 把基准版本 checkout 到 _base/
#   ② 跑 scripts/ci-preview.mjs → 语义 diff + 只渲染改动的小节（PNG + MP3）
#   ③ 把结果当评论贴回 PR
#
# ── 关于 MuseScore 的版本（踩过的坑，别改回去）────────────────────
#
# Ubuntu 24.04 的 apt 里**只有 v2 和 v3**：
#   musescore   2.3.2
#   musescore3  3.2.3
#   （没有 musescore4）
#
# 而 MuseScore 4 存的 .mscx 是 version="4.50"/"4.60"，**MuseScore 3 打不开**。
# 所以 `apt install musescore3` 会装上一个读不了你乐谱的程序 —— workflows 显示
# 成功，实际每次都静默失败。只能用 v4 的 AppImage。
#
# ── 关于无头环境 ──────────────────────────────────────────────────
#
# MuseScore 是 Qt 应用，需要 X display。CI 上没有显示器，会报
#   "qt.qpa.xcb: could not connect to display"
# 所以要 xvfb-run 包一层。MuseScore 官方论坛确认：他们自己的 CI 就是这么做的。

name: 乐谱改动预览

on:
  pull_request:
    paths:
      - 'pieces/**/*.mscx'
      - 'scripts/**'
      - '.github/workflows/score-preview.yml'
  workflow_dispatch: # 允许手动触发（第一次验证用）

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: 取提交版本
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 算基准 SHA
        id: base
        run: |
          # PR：跟目标分支的基线比
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            sha="${{ github.event.pull_request.base.sha }}"
          # 手动触发：跟上一次提交比；只有一个提交时跟自己比（会得到"没有改动"）
          elif git rev-parse HEAD~1 >/dev/null 2>&1; then
            sha="$(git rev-parse HEAD~1)"
          else
            sha="$(git rev-parse HEAD)"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "基准：$sha"

      - name: 取基准版本
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.base.outputs.sha }}
          path: _base

      - name: 装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 装 MuseScore 4（AppImage）+ Xvfb
        run: |
          set -e
          sudo apt-get update -qq
          # xvfb 给虚拟显示器；libfuse2 是 AppImage 直跑的依赖
          # （下面用 --appimage-extract 绕开 FUSE，装不上也不影响）
          sudo apt-get install -y -qq xvfb libfuse2 || sudo apt-get install -y -qq xvfb

          curl -sSL -o /tmp/MuseScore.AppImage \
            https://musescore.org/en/download/musescore-x86_64.AppImage
          chmod +x /tmp/MuseScore.AppImage

          # 解开，避免依赖 FUSE
          cd /tmp && /tmp/MuseScore.AppImage --appimage-extract > /dev/null
          ls /tmp/squashfs-root/AppRun

          # 包装成 PATH 上的 mscore —— 这样本地和 CI 用的是同一个名字，
          # ci-preview.mjs 的 findMuseScore() 按名字找得到。
          sudo tee /usr/local/bin/mscore > /dev/null <<'WRAP'
          #!/bin/sh
          exec xvfb-run -a /tmp/squashfs-root/AppRun "$@"
          WRAP
          sudo chmod +x /usr/local/bin/mscore

          mscore --version || echo "⚠️ mscore 起不来，这次只会出 diff"

      - name: 生成对照
        run: node scripts/ci-preview.mjs --base-dir _base --out out

      - name: 上传产出
        uses: actions/upload-artifact@v4
        with:
          name: score-preview
          path: out/
          retention-days: 14

      - name: 贴回 PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const body = fs.readFileSync('out/report.md', 'utf8')
            const marker = '<!-- openmuse-preview -->'
            const full = marker + '\n' + body

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            })
            const mine = comments.find(c => c.body?.includes(marker))

            if (mine) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: mine.id, body: full,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body: full,
              })
            }
