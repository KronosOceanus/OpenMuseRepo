# GitHub Actions：PR 时自动生成乐谱对照
#
# 这就是整件事的"自动化"部分。它做的是：
#   ① 把基准分支的乐谱 checkout 到 _base/
#   ② 跑 scripts/ci-preview.mjs → 语义 diff + 只渲染改动的小节（PNG + MP3）
#   ③ 把结果当评论贴回 PR
#
# 于是审核的人不需要开 MuseScore、不需要自己找位置 ——
# PR 里直接看到「第几小节、哪一行变了、长什么样、听起来怎样」。

name: 乐谱改动预览

on:
  pull_request:
    paths:
      - 'pieces/**/*.mscx'
      - 'scripts/**'
      - '.github/workflows/score-preview.yml'

permissions:
  contents: read
  pull-requests: write # 贴评论要用

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: 取提交版本
        uses: actions/checkout@v4

      - name: 取基准版本
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: _base

      - name: 装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 装 MuseScore
        run: |
          sudo apt-get update -qq
          # Ubuntu runner 上包名随版本变化，装到哪个用哪个
          sudo apt-get install -y -qq musescore3 || sudo apt-get install -y -qq musescore || true
          which mscore musescore3 musescore || echo "没装上 MuseScore，只会出 diff"

      - name: 生成对照
        run: node scripts/ci-preview.mjs --base-dir _base --out out

      - name: 上传产出（图片和音频没法直接贴进评论，作为 artifact 附上）
        uses: actions/upload-artifact@v4
        with:
          name: score-preview
          path: out/
          retention-days: 14

      - name: 贴回 PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const body = fs.readFileSync('out/report.md', 'utf8')
            const marker = '<!-- openmuse-preview -->'
            const full = marker + '\n' + body

            // 找已有的预览评论，有就更新，没有就新建（避免每次都堆一条）
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            })
            const mine = comments.find(c => c.body?.includes(marker))

            if (mine) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: mine.id, body: full,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body: full,
              })
            }
