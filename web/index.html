<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenMuse</title>

<!--
  OpenMuse 乐谱播放 / 对比页

  ── 单曲模式 ──────────────────────────────────────────────────────
      一个 AlphaTab 实例，看谱 + 播放。

  ── 对比模式（左右分栏）──────────────────────────────────────────
      pieces.json 里给一首曲子加：
        "compareFile": "pieces/xxx-mod.musicxml",   ← 对比版本
        "compare":     "pieces/xxx.diff.json"       ← 差异清单

      左边渲染 file（基准），右边渲染 compareFile（对比）。
      基准侧把改动处标红，对比侧标绿 —— 像 GitHub 的 diff，
      只不过红绿各自长在自己那一版谱子上。

      **为什么左右分栏，而不是把两版摞成一份谱：**
        摞叠要先把两个版本合成一份文件（merge-versions.mjs）。
        声部一多那份文件的结构就出问题 —— 实测 11 个声部的曲子
        合并后 22 个 part，MuseScore 直接段错误，转不出 MusicXML。
        分栏只需各自的 MusicXML，压根不用合并，而且结构不同的
        两个版本也能比。

  ── 依赖全部在 vendor/ 下，不走 CDN。加 ?debug 显示诊断面板。──
-->

<style>
  :root {
    --bg: #16161a; --panel: #1e1e24; --line: #2c2c34;
    --text: #e6e6ea; --dim: #8a8a96; --accent: #4a9eff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    display: flex; flex-direction: column;
  }

  header {
    flex: none; padding: 10px 16px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 12px;
  }
  header h1 { margin: 0; font-size: 15px; font-weight: 600; }
  header .sub { color: var(--dim); font-size: 12px; }
  header .right { margin-left: auto; display: flex; align-items: baseline; gap: 12px; }
  header a { color: var(--accent); text-decoration: none; font-size: 13px; }
  header a:hover { text-decoration: underline; }
  #status { color: var(--dim); font-size: 12px; }

  main { flex: 1; min-height: 0; display: flex; flex-direction: column; }

  #hint { padding: 40px 20px; text-align: center; color: var(--dim); white-space: pre-wrap; }
  #hint.error { color: #ff6b6b; }

  /* ── 曲目列表 ── */
  #list { padding: 24px; overflow: auto; }
  #list h2 { font-size: 13px; color: var(--dim); font-weight: 500; margin: 0 0 12px; }
  .card {
    display: block; padding: 14px 18px; margin-bottom: 10px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; color: var(--text); text-decoration: none;
  }
  .card:hover { border-color: var(--accent); }
  .card .t { font-size: 15px; font-weight: 600; }
  .card .m { color: var(--dim); font-size: 12px; margin-top: 2px; }
  .card .badge {
    display: inline-block; margin-left: 8px; padding: 1px 7px; border-radius: 4px;
    background: var(--accent); color: #fff; font-size: 11px; vertical-align: 2px;
  }

  /* ── 单曲：一个谱面区 ──
     min-height:0 不能省 —— flex 子项默认 min-height:auto，内容一长就撑开，
     把下面的控制条挤出屏幕。 */
  #score { flex: 1; min-height: 0; overflow: auto; background: #fff; padding: 8px 0; }

  /* ── 对比：左右分栏 ── */
  #cmpWrap { flex: 1; min-height: 0; display: flex; gap: 1px; background: var(--line); }
  .pane { flex: 1 1 50%; min-width: 0; display: flex; flex-direction: column; background: #fff; }
  .pane-hd {
    flex: none; padding: 5px 12px; font-size: 12px; font-weight: 600;
    background: var(--panel); color: var(--dim); border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 8px;
  }
  .pane-hd .dot { width: 8px; height: 8px; border-radius: 50%; }
  .pane-hd .dot.red   { background: #e13737; }
  .pane-hd .dot.green { background: #1ea546; }
  .pane-hd .cnt { margin-left: auto; font-weight: 400; }
  .pane-score { flex: 1; min-height: 0; overflow: auto; padding: 4px 0; }

  /* ── 红绿标注 ──
     和 AlphaTab 自己的光标一样插在同一个父元素里，绝对定位，
     所以坐标系和 noteHeadBounds 是同一套。 */
  .om-diff-layer { position: absolute; inset: 0; pointer-events: none; z-index: 900; }
  .om-diff-mark { position: absolute; pointer-events: none; }

  /* 四种风格，用 ?mark=xxx 切换：
       circle 椭圆（默认）· glow 柔光 · box 方框 · underline 下划线 */
  .om-diff-mark.circle { border-radius: 50%; }
  .om-diff-mark.glow   { border-radius: 5px; }
  .om-diff-mark.box    { border-radius: 4px; }
  .om-diff-mark.underline { border-radius: 0; border-bottom: 2.5px solid; background: transparent !important; }

  .om-diff-mark.red.circle, .om-diff-mark.red.glow { background: rgba(255, 70, 70, .28); }
  .om-diff-mark.green.circle, .om-diff-mark.green.glow { background: rgba(45, 190, 90, .28); }
  .om-diff-mark.red.box {
    background: rgba(255, 70, 70, .16);
    box-shadow: inset 0 0 0 1.5px rgba(225, 55, 55, .95);
  }
  .om-diff-mark.green.box {
    background: rgba(45, 190, 90, .16);
    box-shadow: inset 0 0 0 1.5px rgba(30, 165, 70, .95);
  }
  .om-diff-mark.red.underline   { border-color: rgba(225, 55, 55, .95); }
  .om-diff-mark.green.underline { border-color: rgba(30, 165, 70, .95); }

  /* ── 播放光标 ────────────────────────────────────────────────────
     ⚠️ 这几行不能省。AlphaTab 只往容器里插 .at-cursors / .at-cursor-bar /
        .at-cursor-beat 这些**空 div**，颜色和粗细全靠页面自己给 ——
        库本身不注入任何样式。

        重写页面时漏掉这段，表现就是「完全没有光标」：
        元素建出来了、坐标也对，但背景透明 → 看不见。
        （阶段 1 有这几行，所以那时光标是正常的。）

     AlphaTab 把定位写成内联样式，所以这里必须 !important 才盖得住。 */
  .at-cursor-bar {
    background: rgba(74, 158, 255, .25) !important;
  }
  .at-cursor-beat {
    background: #4a9eff !important;
    width: 3px !important;
    box-shadow: 0 0 4px rgba(74, 158, 255, .85);
  }
  /* 正在播放的音符高亮 */
  .at-highlight * {
    fill: #1f6fd0 !important;
    stroke: #1f6fd0 !important;
  }

  /* ── 记号差异的色条 ──────────────────────────────────────────────
     音符差异有坐标（音符头），可以画红绿框。**记号没有** ——
     力度挂在某拍上、连音线跨几个音、文字挂在时间轴上，都没法"框住"。
     所以记号差异在**小节左边缘**画一条紫色竖条，含义是
     「这一小节除了音符还有别的变化，去差异列表看」。

     紫色和红绿区分开，一眼能分辨是哪一类差异。 */
  .om-mark-bar {
    position: absolute; pointer-events: none; z-index: 880;
    background: rgba(168, 85, 220, .85);
    border-radius: 2px;
    box-shadow: 0 0 4px rgba(168, 85, 220, .5);
  }
  /* 整声部空缺：琥珀色 —— 和红/绿（音符）、紫（记号）都区分开。
     它不是"某处不同"，而是"这个声部压根没内容"，性质不同。 */
  .cmp-sep.warn { color: #e0a33a; }
  .cmp-row.missing .who { color: #e0a33a; }
  .cmp-row.missing .mkbody { color: #f0c070; font-size: 11px; }
  .cmp-row.missing { cursor: default; }
  .cmp-sep {
    padding: 7px 12px 4px; font-size: 11px; color: #a855dc;
    border-top: 1px solid var(--line); margin-top: 5px;
  }
  .cmp-row.mark .who { color: #a855dc; }
  .cmp-row.mark .mkbody { color: #c9a0e8; font-size: 11px; }

  /* ── 影子光标 ────────────────────────────────────────────────────
     「没在播的那一边」用不了真光标（给那边的实例设 tickPosition 会
     触发它自己的自动滚动，滚一截又经同步传回来 —— 就是那个
     「每按一次按钮往下蹿」）。所以改成**纯视觉**的：从在播那边读当前
     小节号，在另一边同一个位置画一个半透明色块。

     不碰 AlphaTab 的任何状态，所以没有任何副作用。 */
  .om-ghost-cursor {
    position: absolute; pointer-events: none; z-index: 890;
    background: rgba(74, 158, 255, .12);
    box-shadow: inset 0 0 0 1.5px rgba(74, 158, 255, .45);
    border-radius: 3px;
  }

  /* ── 底部控制条 ── */
  footer {
    flex: none; padding: 9px 16px; border-top: 1px solid var(--line);
    background: var(--panel); display: flex; align-items: center; gap: 10px;
  }
  button {
    background: var(--line); color: var(--text); border: 0; border-radius: 6px;
    padding: 6px 13px; font-size: 14px; cursor: pointer;
  }
  button:hover { background: #383842; }
  button.primary { background: var(--accent); color: #fff; }
  button.primary:hover { background: #3d8ae6; }
  #seek { flex: 1; accent-color: var(--accent); }
  #time { color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; min-width: 92px; text-align: right; }

  .listen { display: flex; align-items: center; gap: 5px; }
  .listen .lbl { color: var(--dim); font-size: 12px; }
  .listen button { padding: 4px 10px; font-size: 12px; }
  .listen button.on { background: var(--accent); color: #fff; }
  .listen button.off { background: transparent; color: var(--dim); box-shadow: inset 0 0 0 1px var(--line); }

  /* ── 差异列表（可折叠，默认收起，不抢乐谱的地方）── */
  #cmp { flex: none; border-top: 1px solid var(--line); background: var(--panel); }
  #cmp .hd {
    padding: 6px 16px; font-size: 12px; color: var(--dim);
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  #cmp .hd b { color: var(--text); font-weight: 600; }
  #cmp .hd .toggle { margin-left: auto; background: transparent; color: var(--accent); padding: 3px 8px; font-size: 12px; }
  #cmp .hd .toggle:hover { background: var(--line); }
  #cmp .body { max-height: 30vh; overflow: auto; border-top: 1px solid var(--line); }
  #cmp .body.hide { display: none; }
  .cmp-row {
    padding: 6px 16px; cursor: pointer; font-size: 13px;
    display: flex; gap: 10px; align-items: baseline;
  }
  .cmp-row:hover { background: #26262e; }
  .cmp-row .no { color: var(--dim); min-width: 58px; font-variant-numeric: tabular-nums; }
  .cmp-row .who { color: var(--dim); min-width: 84px; font-size: 12px; }
  .cmp-row .rm { color: #ff7b7b; }
  .cmp-row .ad { color: #6ee06e; }
  .cmp-row .arrow { color: var(--dim); }

  /* ── 缩放 / 滚动开关 ────────────────────────────────────────────
     ⚠️ 原来是 position:fixed; bottom:64px 的浮动盒子 —— 那个位置
        正好压在差异列表标题行的【展开】按钮上（按钮右对齐，
        而盒子也在右边），z-index 2000 压着，按钮点不到。
        症状很怪：先展开诊断面板、布局位移之后按钮才能点。

        现在改成底部控制条里的最后一段：永远是右下角，
        而且不覆盖任何可点元素。 */
  #zoom {
    display: flex; align-items: center; gap: 2px;
    margin-left: auto;          /* 推到控制条最右 */
    background: var(--bg); border: 1px solid var(--line);
    border-radius: 7px; padding: 2px;
  }
  #zoom button {
    width: 32px; height: 30px; padding: 0; font-size: 17px; line-height: 1;
    background: transparent; color: var(--text);
  }
  #zoom button:hover { background: var(--line); }
  #zoom #zVal {
    min-width: 46px; text-align: center; font-size: 12px; color: var(--dim);
    font-variant-numeric: tabular-nums; cursor: pointer;
  }
  #zoom #zVal:hover { color: var(--text); }
  #zoom .zsep { width: 1px; height: 20px; background: var(--line); margin: 0 3px; }
  /* 自动滚动关掉时那个按钮变暗 */
  #zoom #zScroll.off { opacity: .4; }

  #debugWrap {
    flex: none; background: #101014; border-top: 1px solid var(--line);
  }
  #dbgHd {
    display: flex; align-items: center; gap: 8px; cursor: pointer;
    padding: 4px 16px; font-size: 11px; color: var(--dim);
    user-select: none;
  }
  #dbgHd:hover { color: var(--text); }
  #dbgHd .dbgToggle { margin-left: auto; color: var(--accent); }
  #debugWrap.collapsed #debug { display: none; }
  #debug {
    max-height: 24vh; overflow: auto; padding: 4px 16px 8px;
    font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #9a9aa6; white-space: pre-wrap;
  }
  #debug .ok   { color: #4ade80; }
  #debug .bad  { color: #ff6b6b; }
  #debug .warn { color: #fbbf24; }
</style>
</head>

<body>

<header>
  <h1 id="title">OpenMuse</h1>
  <span class="sub" id="sub">乐谱播放</span>
  <span class="right">
    <a id="back" href="./" style="display:none">← 曲目列表</a>
    <span id="status"></span>
  </span>
</header>

<main id="main"></main>

<footer id="footer" style="display:none">
  <!-- 只有一个按钮：播放 / 暂停 切换（原来还有个「停止」，去掉了 ——
       要回到开头拖进度条就行，多一个按钮反而要想"这俩有什么区别"） -->
  <button id="btnPlay" class="primary">▶ 播放</button>
  <input id="seek" type="range" min="0" max="1000" value="0">
  <span id="time">0:00 / 0:00</span>
  <span class="listen" id="listen" style="display:none">
    <span class="lbl">听：</span>
  </span>
<div id="zoom">
  <button id="zOut" title="缩小">−</button>
  <span id="zVal" title="点一下恢复 100%">100%</span>
  <button id="zIn" title="放大">+</button>
  <span class="zsep"></span>
  <button id="zScroll" title="播放时是否自动滚动">⇅</button>
</div>
</footer>


<script src="vendor/alphaTab.min.js"></script>
<script>
(function () {
  'use strict'

  var BUILD = 'build-95'
  var params = new URLSearchParams(location.search)
  var DEBUG = params.has('debug')

  // 标记样式与微调。默认值都是实调出来的。
  //   ?mark=circle|glow|box|underline
  //   ?mds=尺寸倍数（只对 circle 有效）  ?mdx/?mdy=像素偏移
  var MARK = (function () {
    var v = params.get('mark')
    // 默认 box（方框）—— 圆点在密集的谱面上不够显眼，
    // 方框的边框能把音符头整个圈住，一眼看得出改了哪个音。
    return ['circle', 'glow', 'box', 'underline'].indexOf(v) >= 0 ? v : 'box'
  })()
  // ⚠️ mdy 的来历：AlphaTab 的 noteHeadBounds 有个不一致 ——
  //    y 按「音符头」算（音符头中心 - 半高），h 却用「整个音符」的高。
  //    于是 y + h/2 不等于音符头中心，框会整体偏上。实测偏约 8px。
  var MARK_SCALE = Number(params.get('mds') || 1.35)
  var MARK_DX = Number(params.get('mdx') || 0)
  var MARK_DY = Number(params.get('mdy') || 8)

  // ⚠️ 这几个是**像素**偏移，必须按当前缩放等比放大。
  //    否则放到 200% 时，音符头变了一倍大、而 +8px 的偏移还是一样 ——
  //    标记就会从音符头上滑开（实测：缩放后跑位）。
  // ── 音频输出模式 ────────────────────────────────────────────────
  //
  //  AlphaTab 默认用 AudioWorklet（PlayerOutputMode.WebAudioAudioWorklets），
  //  但它有个已知的竞态问题（github.com/CoderLine/alphaTab/issues/2561
  //  「playback freezes due to race condition between async worklet
  //   creation and sample delivery」）。
  //
  //  单实例时只是偶发卡顿；**左右并排是两个实例，两个 worklet 同时抢
  //  音频线程**，一拖进度条就很容易乱。
  //
  //  ⟹ 对比模式默认改用 legacy 的 ScriptProcessor（值 1）。
  //     ?output=worklet 可以强制切回去对比。
  var OUTPUT = (function () {
    var v = params.get('output')
    if (v === 'worklet') return 0
    if (v === 'script') return 1
    return null   // 自动：对比模式用 1，单曲用 0
  })()
  function outputMode(isCompare) {
    if (OUTPUT !== null) return OUTPUT
    return isCompare ? 1 : 0
  }

  // ── 自动滚动开关 ────────────────────────────────────────────────
  //  AlphaTab 的 scrollMode：
  //     0 Off         不自动滚
  //     1 Continuous  光标一动就滚
  //     2 OffScreen   光标出屏才滚
  //     3 Smooth      平滑持续滚
  //  默认是 1。有些人觉得播放时页面自己动很烦，所以给个开关。
  //  URL 用 ?scroll=0 / ?scroll=1 也能指定。
  var AUTO_SCROLL = (function () {
    var v = params.get('scroll')
    if (v === '0' || v === 'off') return false
    if (v === '1' || v === 'on') return true
    return true
  })()
  function autoScroll() { return AUTO_SCROLL }

  var zoomRatio = 1
  var baseScale = 1        // 当前曲目的 display.scale（只在诊断里报出来）
  function markDx() { return MARK_DX * zoomRatio }
  function markDy() { return MARK_DY * zoomRatio }

  // ⚠️ 试过让偏移按 display.scale 等比放大（0.5 标定 → 1.0 时翻倍），
  //    **撤回了**，因为和实测对不上：
  //      神话2（scale 0.75）和优纪（scale 1.0）在固定 8px 下是正常的，
  //      翻倍会从 8px 变成 12px / 16px —— 把已经对的弄坏。
  //    ⟹「漂移正比于缩放」这个模型不成立。
  //
  //    而 Dreamy 那个「钟琴的框跑到钢琴低音谱表」是**整行谱表**的距离
  //    （几十像素），量级上不可能是几像素的偏移问题 ——
  //    真因是谱表区间算错（见下面的 staffRanges）。
  //
  //    以后真遇到小的纵向偏移：先用 ?mdy=N 手工标定出对的值，
  //    再决定要不要写成公式。**别凭猜测改已经验证过的东西。**

  // 排版参数（默认值是在 11 声部总谱上实调出来的，见 web/README.md）
  function numParam(n, d) { var v = params.get(n); if (v === null || v === '') return d; var x = Number(v); return isNaN(x) ? d : x }
  function boolParam(n, d) { var v = params.get(n); if (v === null) return d; return v === '1' || v === 'true' || v === 'yes' }

  var DISPLAY = {
    layoutMode: 0,
    scale: numParam('scale', 0.5),
    stretchForce: numParam('stretch', 1),
    justifyLastSystem: boolParam('justify', true),
    barsPerRow: numParam('bars', -1),
    systemPaddingTop: numParam('syspad', 60),
    systemPaddingBottom: numParam('syspad', 60),
    lastSystemPaddingBottom: numParam('lastpad', 24),
    trackStaffPaddingBetween: numParam('staffpad', 24),
    padding: [numParam('padx', 24), numParam('pady', 20)],
  }

  var el = {
    main: document.getElementById('main'),
    title: document.getElementById('title'),
    sub: document.getElementById('sub'),
    back: document.getElementById('back'),
    status: document.getElementById('status'),
    footer: document.getElementById('footer'),
    listen: document.getElementById('listen'),
    play: document.getElementById('btnPlay'),
    seek: document.getElementById('seek'),
    time: document.getElementById('time'),
    debug: null,
  }

  // ── 日志：只在 ?debug 时建面板 ──
  var t0 = Date.now()
  if (DEBUG) {
    // 外面套一层，默认折起来 —— 平时看谱时它太长，需要时再展开。
    var wrap = document.createElement('div')
    wrap.id = 'debugWrap'
    wrap.className = 'collapsed'
    var hd = document.createElement('div')
    hd.id = 'dbgHd'
    var cnt = document.createElement('span')
    cnt.id = 'dbgCnt'
    hd.innerHTML = '<span>诊断</span>'
    hd.appendChild(cnt)
    var tg = document.createElement('span')
    tg.className = 'dbgToggle'
    tg.textContent = '▲ 展开诊断'
    hd.appendChild(tg)
    hd.onclick = function () {
      var c = wrap.className.indexOf('collapsed') >= 0
      wrap.className = c ? '' : 'collapsed'
      tg.textContent = c ? '▼ 收起诊断' : '▲ 展开诊断'
    }
    el.debug = document.createElement('div')
    el.debug.id = 'debug'
    wrap.appendChild(hd)
    wrap.appendChild(el.debug)
    document.body.appendChild(wrap)
  }
  var dbgCount = 0
  function log(msg, cls) {
    if (!el.debug) return
    var d = document.createElement('div')
    if (cls) d.className = cls
    d.textContent = ((Date.now() - t0) / 1000).toFixed(2) + 's  ' + msg
    el.debug.appendChild(d)
    el.debug.scrollTop = el.debug.scrollHeight
    dbgCount++
    var c = document.getElementById('dbgCnt')
    if (c) c.textContent = '（' + dbgCount + ' 条）'
    console.log('[openmuse]', msg)
  }

  function fmt(ms) {
    if (!isFinite(ms) || ms < 0) ms = 0
    var s = Math.floor(ms / 1000)
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0')
  }
  function esc(t) {
    return String(t).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]
    })
  }
  function setHint(text, isErr) {
    el.main.innerHTML = ''
    if (!text) return
    var d = document.createElement('div')
    d.id = 'hint'
    if (isErr) d.className = 'error'
    d.textContent = text
    el.main.appendChild(d)
  }

  log('=== ' + BUILD + ' ===  ' + location.href)
  log('标记样式：' + MARK + (MARK === 'circle' ? '  尺寸×' + MARK_SCALE : '') +
      '  偏移(' + MARK_DX + ',' + MARK_DY + ')')

  // ═════════════════════════════════════════════════════════════════
  //  AlphaTab 事件注册（每个单独包 —— 某个事件在当前版本不存在时
  //  只跳过它，不让整页挂掉）
  //
  //  ⚠️ 这条规则是踩出来的：早期写法里某个事件不存在，.on() 抛异常，
  //     后面所有代码（包括按钮绑定）都不执行 —— 表现是「点击毫无反应」，
  //     而且连日志都打不出来。见 web/README.md 的坑 ②⑦。
  // ═════════════════════════════════════════════════════════════════
  /** 第 idx 小节（0 基）在整曲里的起始 tick。 */
  function measureStartTick(api, idx) {
    if (!api || !api.score || !api.score.masterBars) return 0
    var mb = api.score.masterBars[idx]
    return mb ? mb.start : 0
  }

  /** 把某一栏滚到指定小节（0 基）。
   *
   *  点差异列表时要显式调用 —— 自动滚动（scrollToCursor）只在播放中、
   *  且光标出屏时才动，点列表时未必满足，所以点了没反应。
   */
  function scrollToMeasure(api, scoreEl, index) {
    if (!api || !api.boundsLookup) return false
    var mb = api.boundsLookup.findMasterBarByIndex(index)
    if (!mb || !mb.realBounds) return false
    var y = Math.max(0, mb.realBounds.y - 40)   // 上面留一点余量
    // ⚠️⚠️ **必须立即滚，不能用 behavior:'smooth'。**
    //
    //    平滑滚动是异步动画，而 bindScroll 会在**每一帧**读到中间位置、
    //    当成"用户滚到了这里"传给对面 —— 对面跟着一串虚假位置乱滚，
    //    抑制机制也追不上。
    //
    //    实测日志（点第 69 小节的记号条目）：
    //        自动滚动：滚到第 69 小节（y=13680）
    //        同步 A→B：小节 0 比例 -0.12 → 对面滚到 7    ← 才动了 1%
    //        同步 A→B：小节 0 比例 -0.11 → 对面滚到 12
    //        同步 A→B：小节 0 比例 -0.10 → 对面滚到 18
    //    结果两栏显示的不是同一小节（截图里左 69、右 67）。
    //
    //    立即滚的话 scrollTop 一步到位，同步读到的就是最终值。
    scoreEl.scrollTop = y
    return true
  }

  /** 让差异列表跟着播放走：高亮当前小节那一行，并把它滚进视野。
   *
   *  注意不能用 row.scrollIntoView() —— 那会把**所有**可滚动祖先都滚一遍，
   *  连带把乐谱也滚了。这里只手动改列表自己的 scrollTop。
   */
  function syncDiffList(api, panel, rowsByMeasure, curRef) {
    if (!panel || !api || api.playerState !== 1) return
    var tick = 0
    try { tick = api.tickPosition } catch (e) { return }
    var bars = (api.score && api.score.masterBars) || []
    var idx = 0
    for (var i = 0; i < bars.length; i++) {
      if (bars[i].start <= tick) idx = i
      else break
    }
    if (curRef.v === idx) return
    curRef.v = idx

    // 先清掉上一次的高亮
    if (curRef.row) { curRef.row.style.background = ''; curRef.row = null }

    var rows = rowsByMeasure[idx]
    if (!rows || !rows.length) return
    // 用户点过的那一行如果就在本小节 → 保持它；否则跟随播放取第一行
    var row = (curRef.sel && rows.indexOf(curRef.sel) >= 0) ? curRef.sel : rows[0]
    curRef.row = row
    row.style.background = 'rgba(74, 158, 255, .18)'

    // 已经可见就不动，免得每拍抖一下
    var pr = panel.getBoundingClientRect(), rr = row.getBoundingClientRect()
    if (rr.top >= pr.top && rr.bottom <= pr.bottom) return
    // 把它挪到列表中间（只动列表，不动别处）
    var d = rr.top - pr.top
    panel.scrollTo({
      top: Math.max(0, panel.scrollTop + d - panel.clientHeight / 2 + rr.height / 2),
      behavior: 'smooth',
    })
  }

  /** 自己实现的「自动滚动到光标」。
   *
   *  为什么不用 AlphaTab 的 scrollMode：
   *    实测它一旦开过就关不干净 —— 关掉之后点任何按钮仍会往下滚，
   *    而且滚的位置不是光标所在处。与其去斗它的内部状态，
   *    不如让它永远不滚（scrollMode: 0），滚动完全由这里控制。
   *
   *  行为：只在光标快要出屏时才滚，滚到光标上方留一点余量。
   *  这样既能跟着走，又不会每一拍都动一下。
   */
  function scrollToCursor(api, scoreEl) {
    if (!AUTO_SCROLL || !api || !api.boundsLookup) return
    if (api.playerState !== 1) return          // 不在播就不滚
    var tick = 0
    try { tick = api.tickPosition } catch (e) { return }
    var bars = (api.score && api.score.masterBars) || []
    if (!bars.length) return

    // 当前 tick 落在哪一小节
    var idx = 0
    for (var i = 0; i < bars.length; i++) {
      if (bars[i].start <= tick) idx = i
      else break
    }
    var mb = api.boundsLookup.findMasterBarByIndex(idx)
    if (!mb || !mb.realBounds) return

    var y = mb.realBounds.y
    var top = scoreEl.scrollTop
    var h = scoreEl.clientHeight
    // 光标还在可视区里（下方留 100px 余量）就不动 —— 否则每拍都滚一下很烦
    if (y >= top + 20 && y <= top + h - 100) return

    try {
      // ⚠️ 同样必须立即滚 —— 理由见 scrollToMeasure 顶上的注释。
      //    播放时每拍都可能滚一次，用动画会让同步一直读到中间帧，两栏互相推。
      scoreEl.scrollTop = Math.max(0, y - 40)
      if (DEBUG && !scrollToCursor._said) {
        scrollToCursor._said = true
        log('自动滚动：滚到第 ' + (idx + 1) + ' 小节（y=' + Math.round(y) + '）')
      }
    } catch (e) {
      scoreEl.scrollTop = Math.max(0, y - 40)
    }
  }

  /** 查光标元素在不在、尺寸多少。
   *  AlphaTab 的光标是 .at-cursors 里的几个空 div，靠内联样式定位 ——
   *  「看不见光标」可能是没建、也可能是建了但尺寸是 0，得分清楚。
   */
  function reportCursor(scoreEl, tag) {
    if (!DEBUG) return
    var c = scoreEl.querySelector('.at-cursors')
    var bar = scoreEl.querySelector('.at-cursor-bar')
    var beat = scoreEl.querySelector('.at-cursor-beat')
    if (!c) { log('光标[' + tag + '] ❌ 没有 .at-cursors（没建出来）', 'warn'); return }
    var r1 = bar ? bar.getBoundingClientRect() : null
    var r2 = beat ? beat.getBoundingClientRect() : null
    log('光标[' + tag + '] .at-cursors=有  bar=' +
        (r1 ? Math.round(r1.width) + '×' + Math.round(r1.height) : '无') +
        '  beat=' + (r2 ? Math.round(r2.width) + '×' + Math.round(r2.height) : '无'))
  }

  function regAll(api, handlers) {
    Object.keys(handlers).forEach(function (name) {
      var ev = api[name]
      if (!ev || typeof ev.on !== 'function') {
        log('✗ ' + name + ' 不存在，跳过', 'warn')
        return
      }
      try { ev.on(handlers[name]); log('✓ ' + name) }
      catch (e) { log('✗ ' + name + ' 注册失败：' + e.message, 'bad') }
    })
  }

  // ═════════════════════════════════════════════════════════════════
  //  红绿标注
  // ═════════════════════════════════════════════════════════════════

  /** 在改动处叠标记。side='base' 标红（改掉的），side='head' 标绿（新增的）。
   *
   *  匹配用「音高 + 小节内 tick」两个键 —— 只按音高会把没变的同音也染上
   *  （实测一个小节里有三个 D5，只改了一个）。
   */
  function drawDiff(api, diff, scoreEl, side, trackOffset) {
    if (!api || !api.boundsLookup) {
      if (DEBUG) log('  ✗ ' + side + '：boundsLookup 还是空的', 'warn')
      return 0
    }
    var key = side === 'base' ? 'removed' : 'added'
    var color = side === 'base' ? 'red' : 'green'

    var cursors = scoreEl.querySelector('.at-cursors')
    var host = (cursors && cursors.parentElement) || scoreEl

    var layer = document.createElement('div')
    layer.className = 'om-diff-layer'
    var n = 0
    var byTrack = {}          // track → 实际标出来的处数

    // ── 记号差异：小节左边缘一条紫色竖条 ──
    // 方向类（速度/力度/文字）和挂载类（连音线/跳音）都画，
    // 因为对用户来说都是"这一小节还有别的变化"。
    if (diff.marks) {
      (diff.marks.marks || []).concat(diff.marks.partMarks || []).forEach(function (mk) {
        var mb = api.boundsLookup.findMasterBarByIndex(mk.index)
        if (!mb) return
        var b = mb.lineAlignedBounds || mb.realBounds
        if (!b || !b.h) return
        var el2 = document.createElement('div')
        el2.className = 'om-mark-bar'
        el2.title = '第 ' + mk.number + ' 小节有记号差异：'
          + (mk.items || []).map(function (k) {
              return k.kind + ' ' + k.from + '→' + k.to
            }).join('；')
        el2.style.left = (b.x - 9) + 'px'
        el2.style.top = b.y + 'px'
        el2.style.width = '4px'
        el2.style.height = b.h + 'px'
        layer.appendChild(el2)
        n++
      })
    }

    // ── 谱表 → track 的对应 ──────────────────────────────────────
    //
    // ⚠️⚠️ **不要用 `api.tracks[i].staves[j].index`。**
    //
    //    那个 index 是**track 内的序号**，不是全局谱表号。实测
    //    Dreamy（钢琴 2 谱表 + 钟琴 + 玻璃琴）：
    //        钢琴   2 谱表 → index 0, 1     ← 看着像全局，其实也是 track 内
    //        钟琴   1 谱表 → index 0        ← 应该是全局 2
    //        玻璃琴 1 谱表 → index 0        ← 应该是全局 3
    //    三个 track 都往 key `0` 写，最后建出来的是 {"0":2,"1":0} ——
    //    映射彻底失效，退回「按声部数整除」（4÷3=1.33），于是
    //    钢琴只拿到高音谱表、钟琴的池子里混进钢琴的低音谱表，
    //    标记就落到别的声部/别的音上了。
    //
    //    ✅ **正确做法：按顺序累积。**
    //       MasterBarBounds.bars 在一个系统里就是按谱表顺序排的，
    //       而 track 也是按顺序占若干个谱表 —— 直接累加出区间。
    //       不依赖任何 .index 字段。
    var staffRanges = []      // [{track, from, to}]
    var acc2 = 0
    ;(api.tracks || []).forEach(function (t) {
      var n = (t.staves || []).length || 1
      staffRanges.push({ track: t.index, from: acc2, to: acc2 + n })
      acc2 += n
    })
    var totalStaves = acc2 || 1

    // ── 映射诊断（一次性）──────────────────────────────────────
    // 「标记落到别的声部」几乎都出在这里，之前一行日志都没有，只能猜。
    if (DEBUG) {
      var trkInfo = (api.tracks || []).map(function (t) {
        return '#' + t.index + '(' + (t.name || '') + ')×' + ((t.staves || []).length || 1) + '谱表'
      })
      log('  声部：tracks=' + (api.tracks || []).length + '  ' + trkInfo.join('  ')
          + '   共占谱表 ' + totalStaves)
      log('  谱表区间：' + staffRanges.map(function (r) {
        return 'track' + r.track + '→[' + r.from + ',' + r.to + ')'
      }).join('  '))
      // ── 诊断：AlphaTab 到底解析到力度记号没有 ──────────────
      // 力度在 AlphaTab 里挂在 **音符**上（Note.dynamics，0~7）。
      // 「页面上看不到 mf」有两种可能：

      //   ① AlphaTab 压根没解析进去   → 导入层的问题
      //   ② 解析进去了但没画出来       → 渲染层的问题
      // 这两者的解法完全不同，必须先分开。
      try {
        var dynFound = []
        ;(api.score && api.score.tracks || []).forEach(function (tr) {
          var hits = 0, where = []
          ;(tr.staves || []).forEach(function (st) {
            ;(st.bars || []).forEach(function (bar, bi) {
              ;(bar.voices || []).forEach(function (v) {
                ;(v.beats || []).forEach(function (b) {
                  ;(b.notes || []).forEach(function (nt) {
                    if (nt.dynamics && nt.dynamics !== 0) {
                      hits++
                      if (where.length < 3) where.push('小节' + (bi + 1) + ' dyn=' + nt.dynamics)
                    }
                  })
                })
              })
            })
          })
          if (hits) dynFound.push('#' + tr.index + '(' + (tr.name || '') + ') ' + hits + ' 处 ' + where.join('、'))
        })
        log('  力度记号解析结果：' + (dynFound.length ? dynFound.join('　｜　')
            : '**一处都没有** —— AlphaTab 没解析到任何力度记号'), dynFound.length ? 'ok' : 'bad')
      } catch (e) { log('  查力度记号失败：' + e.message, 'warn') }

      log('  （staves[j].index 是 track 内序号，**不是**全局谱表号：'
          + (api.tracks || []).map(function (t) {
              return '#' + t.index + ':' + (t.staves || []).map(function (st) { return st.index }).join(',')
            }).join('  ') + '）')
    }

    // 按小节汇总，省得每个条目都查一次坐标
    var byMeasure = {}
    diff.measures.forEach(function (m) {
      (byMeasure[m.index] = byMeasure[m.index] || []).push(m)
    })

    Object.keys(byMeasure).forEach(function (idx) {
      var mb = api.boundsLookup.findMasterBarByIndex(Number(idx))
      if (!mb) return
      var bars = mb.bars || []

      byMeasure[idx].forEach(function (m) {
        // ⚠️ 按【栏】分别计数 —— diff 对象是两栏共用的，用一个全局计数
        //    会被左栏吃掉前 12 条，右栏就一条日志都打不出来，
        //    看着像"右栏完全没画"。这个坑差点让我误判。
        if (DEBUG) {
          drawDiff._n = drawDiff._n || {}
          drawDiff._n[side] = (drawDiff._n[side] || 0) + 1
          m._dbg = drawDiff._n[side] <= 12
        }
        // ⚠️ 这里原来有 `if (m.track == null) return` —— 是「按下标配对」
        //    时代的残留守卫。改用按名字配对后，清单里只有 trackA/trackB、
        //    **不再有 track**，于是这行每次都命中、直接 return，
        //    一个小节都标不出来（表现是"完全没有标注"）。
        //    真正该守的是下面那个 wantTrack。
        // ⚠️ 声部是**按名字**配对出来的，两边的下标不一定相同。
        //    例：moonlight melody 的 live 版和完整版共有的双簧管，
        //    分别在两个文件的第 0 位和第 6 位。
        //    所以要用 diff 里给的 trackA / trackB，不能假设两边同号。
        var wantTrack = (side === 'base') ? m.trackA : m.trackB
        if (wantTrack == null) wantTrack = m.track + (trackOffset || 0)  // 兼容旧格式
        // 找到这个 track 占的谱表区间
        var range = null
        for (var ri = 0; ri < staffRanges.length; ri++) {
          if (staffRanges[ri].track === wantTrack) { range = staffRanges[ri]; break }
        }
        var from, to, how
        if (range && bars.length >= totalStaves) {
          from = Math.min(range.from, bars.length)
          to = Math.min(range.to, bars.length)
          how = '按声部谱表区间'
        } else {
          // 退路：谱表总数对不上（正常不该发生 —— 说明某个系统里
          // 没有包含全部谱表）。退回按声部数整除。
          var perTrack = bars.length / (staffRanges.length || 1)
          from = Math.floor(wantTrack * perTrack)
          to = Math.min(bars.length, Math.max(from + 1, Math.floor((wantTrack + 1) * perTrack)))
          how = '整除推算（谱表数 ' + bars.length + ' ≠ ' + totalStaves + '）'
          if (DEBUG) {
            log('  ⚠️ 谱表区间对不上：本系统 bars=' + bars.length
                + '，api.tracks 共占谱表 ' + totalStaves
                + ' → 退回整除推算（这会让标记错位）', 'bad')
          }
        }
        var want = m[key]
        if (!want || !want.length) return

        // 先把这个 track 的所有音符头收集起来，再分两轮匹配：
        //   第一轮  音高 + 小节内 tick 都要对得上（精确，避免同音误标）
        //   第二轮  某小节严格匹配一个都没中时，退化成只按音高
        //          （tick 的换算万一有偏差，不至于整个小节都标不出来）
        var pool = []
        for (var bi = from; bi < to; bi++) {
          var bb = bars[bi]
          ;(bb.beats || []).forEach(function (bt) {
            var tick = bt.beat ? bt.beat.displayStart : null
            ;(bt.notes || []).forEach(function (nb) {
              // ⚠️⚠️ **必须用 displayValue（记谱音高），不能用 realValue。**
              //
              //    realValue 是**实际发声音高**，已经把乐器的移调算进去了。
              //    而差异清单里的 pitch 来自 MusicXML 的 <pitch> —— 那是记谱音高。
              //
              //    实测 Dreamy 的钟琴（glockenspiel）：谱上写 E5/B4，
              //    AlphaTab 的 realValue 给的是 E7/B6（高两个八度）——
              //    差了 24 个半音，一个都匹配不上 → 钟琴完全没有红绿标记。
              //
              //    钢琴是 C 调乐器，两者相同，所以它一直正常 —— 这个 bug
              //    只在移调乐器上发作（Bb 单簧管、钟琴、萨克斯… 都会中）。
              pool.push({
                nb: nb, tick: tick,
                pitch: nb.note
                  ? (nb.note.displayValue != null ? nb.note.displayValue : nb.note.realValue)
                  : null,
                real: nb.note ? nb.note.realValue : null,
              })
            })
          })
        }

        var hits = pool.filter(function (o) {
          return want.some(function (x) { return x.pitch === o.pitch && x.tick === o.tick })
        })
        var wantCount = (m[key] || []).length
        var relaxed = false, dropped = 0
        if (!hits.length) {
          // ⚠️ 退化成「音高 + 最近位置」。
          //
          //    实测需要这一步：清单的 tick 和页面算出来的会差 1 个 tick
          //    （取整方式不同），精确匹配就落空了。
          //
          //    **但不要在这里排除"有歧义的音高"。**
          //    试过：同一个音高出现两次就全部丢弃 —— 结果
          //    改后有两个 F4，差异清单要标第一个，却因为"有两个 F4"
          //    把两个都扔了，绿框一个都没有。
          //
          //    「最近的那个」这个信息已经足够定位了；再叠一层歧义判断
          //    只会造成漏标。**漏标比标错更难发现** —— 实测就是这么
          //    漏掉了一处，靠肉眼逐个核对才看出来。
          var cand = pool.filter(function (o) {
            return want.some(function (x) { return x.pitch === o.pitch })
          })
          // 同一音高只保留最近的那一个（按 want 里的 tick 距离）
          var used = {}
          hits = []
          cand.forEach(function (o) {
            var d = 1e9
            want.forEach(function (x) {
              if (x.pitch === o.pitch) d = Math.min(d, Math.abs(x.tick - o.tick))
            })
            var key = o.pitch
            if (!(key in used) || d < used[key].d) {
              if (used[key]) hits.splice(hits.indexOf(used[key].o), 1)
              used[key] = { d: d, o: o }
              hits.push(o)
            }
          })
          relaxed = hits.length > 0
        }

        if (DEBUG && (m._dbg || dropped || !hits.length)) {
          log('    小节 ' + m.number + ' ' + (m.trackName || '') +
              '：wantTrack=' + wantTrack + ' 谱表 ' + from + '..' + to +
              '（' + how + '）本系统 bars=' + bars.length + ' 应=' + totalStaves +
              ' 池 ' + pool.length + ' 命中 ' + hits.length
              + (relaxed ? '　[按音高兜底]' : '')
              + (dropped ? '　**丢弃有歧义的 ' + dropped + ' 个**' : ''), 'warn')
        }
        if (DEBUG && !drawDiff._saidHow) {
          drawDiff._saidHow = true
          log('  标注定位方式：' + how)
        }
        if (relaxed && DEBUG) {
          log('    小节 ' + m.number + ' track ' + m.track + '：tick 没对上，退化成按音高标了 ' + hits.length + ' 处', 'warn')
        }

        // ⚠️⚠️ **标不出来必须出声。**
        //
        //    清单说"这一小节这个声部改了 N 处"，页面却一个框都没画 ——
        //    这是本工具最阴的失败模式：没有报错、没有日志，
        //    表现就是"某些声部完全没有红绿标记"，而人会以为"没差异"。
        //
        //    实测踩过：Dreamy 的钟琴有 1 处改动，因为谱表区间算错，
        //    池子里装的是钢琴的低音谱表 → 命中 0 → 静默什么都不画。
        var drawnHere = 0
        if (wantCount && hits.length === 0) {
          if (DEBUG) {
            log('  ❌ 小节 ' + m.number + '（' + (m.trackName || '') + '）：清单说改了 '
                + wantCount + ' 处，但**一个都没标出来**'
                + '　[wantTrack=' + wantTrack + ' 谱表 ' + from + '..' + to
                + ' 池 ' + pool.length
                + ' 池内记谱 ' + JSON.stringify(
                    pool.slice(0, 12).map(function (o2) { return o2.pitch }))
                + ' 池内实音 ' + JSON.stringify(
                    pool.slice(0, 12).map(function (o2) { return o2.real }))
                + ' 待标 ' + JSON.stringify(want.slice(0, 6).map(function (x) { return x.pitch }))
                + ']', 'bad')
          }
        }

        hits.forEach(function (o) {
              var nb = o.nb
              var b = nb.noteHeadBounds
              if (!b) return
              drawnHere++
              var d = document.createElement('div')
              d.className = 'om-diff-mark ' + MARK + ' ' + color
              var cx = b.x + b.w / 2 + markDx()
              var cy = b.y + b.h / 2 + markDy()
              if (MARK === 'underline') {
                d.style.left = (b.x - 2) + 'px'
                d.style.top = (b.y + b.h - 1) + 'px'
                d.style.width = (b.w + 4) + 'px'
                d.style.height = '2px'
              } else if (MARK === 'circle') {
                var rw = Math.max(b.w, 7) * MARK_SCALE
                var rh = Math.max(b.h, 7) * MARK_SCALE
                d.style.left = (cx - rw / 2) + 'px'
                d.style.top = (cy - rh / 2) + 'px'
                d.style.width = rw + 'px'
                d.style.height = rh + 'px'
              } else {
                d.style.left = (b.x - 3 + markDx()) + 'px'
                d.style.top = (b.y - 3 + markDy()) + 'px'
                d.style.width = (b.w + 6) + 'px'
                d.style.height = (b.h + 6) + 'px'
              }
              layer.appendChild(d)
              n++
              byTrack[wantTrack] = (byTrack[wantTrack] || 0) + 1
        })
      })
    })

    // ── 按声部汇总：一眼看出「哪个声部一处都没标」 ──────────────
    // 那几乎总是出问题了 —— 清单说改了，画面上一个框都没有，
    // 而人看到的只是"这里没差异"。
    if (DEBUG) {
      // 第一次渲染往往什么都没画（坐标还没就绪），那种 0 处是正常的，
      // 报出来只会误导。所以：清单里本来就没有东西时就不报了。
      var wantByTrack = {}
      diff.measures.forEach(function (m) {
        var t = (side === 'base') ? m.trackA : m.trackB
        var k = (m.trackName || '?') + ' #' + t
        wantByTrack[k] = wantByTrack[k] || { want: 0, track: t }
        wantByTrack[k].want += (m[(side === 'base' ? 'removed' : 'added')] || []).length
      })
      var lines = Object.keys(wantByTrack).map(function (k) {
        // ⚠️ 这里原来写的是 `var w = wantByTrack[k].want` —— 取出来是**数字**，
        //    接着又用 `w.track`，得到 undefined，于是 byTrack[undefined] 恒为 0。
        //    结果每一栏都报「❌ 一处都没标」，而标记其实全都画对了。
        //    **诊断本身出错比没有诊断更糟** —— 它把人引向不存在的 bug。
        var w = wantByTrack[k]                 // 要的是整个对象
        var got = byTrack[w.track] || 0
        var mark = (w.want > 0 && got === 0) ? '  ❌ 一处都没标'
                 : (got < w.want ? '  ⚠️ 少标了' : '')
        return k + ' 待标 ' + w.want + ' → 实标 ' + got + mark
      })
      log('  ' + side + ' 栏标记：共 ' + n + ' 处（本栏 tracks=' + (api.tracks || []).length
          + ' 应占谱表=' + totalStaves + '）　｜　' + lines.join('　｜　'),
          Object.keys(wantByTrack).some(function (k) {
            return wantByTrack[k].want > 0 && !(byTrack[wantByTrack[k].track] > 0)
          }) ? 'bad' : undefined)
    }

    host.appendChild(layer)
    return n
  }

  /** 清掉标注层。合并谱要叠两批（红先、绿后），叠之前先清一次。 */
  function clearDiff(scoreEl) {
    var cursors = scoreEl.querySelector('.at-cursors')
    var host = (cursors && cursors.parentElement) || scoreEl
    Array.prototype.slice.call(host.querySelectorAll('.om-diff-layer')).forEach(function (l) {
      l.parentNode.removeChild(l)
    })
  }

  // ═════════════════════════════════════════════════════════════════
  //  对比模式：左右分栏
  // ═════════════════════════════════════════════════════════════════

  function loadJson(url) {
    return fetch(url, { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json() })
  }

  var state = null   // 对比模式的全局状态（供底部控制条用）

  /** 校验一份清单确实是「这一对文件」比出来的。
   *
   *  清单里有 source 字段（由对比脚本写入，形如
   *  「a.musicxml ↔ b.musicxml」）。如果它和条目的 file/compareFile
   *  对不上，说明 pieces.json 里挂错了清单 ——
   *
   *  ⚠️ 挂错**不会报任何错**，只是页面显示的是别的两份文件的差异。
   *     实测踩过：给「只有记号改动」的条目挂了「音符改动版」的清单，
   *     于是那个本该 0 条音符差异的页面冒出一堆红绿框。
   *
   *  ⟹ 这里显式校验，对不上就拒绝渲染并说明原因 —— 宁可什么都不画，
   *     也不要画错的。
   */
  function checkSource(label, data, piece) {
    if (!data || !data.source) return true          // 旧清单没这个字段，放过
    var want = String(piece.file).split('/').pop() + ' ↔ ' +
               String(piece.compareFile).split('/').pop()
    if (data.source === want) return true
    log('⚠️ ' + label + ' 的 source 对不上！', 'bad')
    log('    清单里写的：' + data.source, 'bad')
    log('    这个条目的：' + want, 'bad')
    return false
  }

  function showCompare(piece, diff) {
    el.title.textContent = piece.title || piece.id
    el.sub.textContent = '左右对照'
    el.back.style.display = ''
    el.footer.style.display = ''
    document.title = (piece.title || piece.id) + ' — OpenMuse'

    // 两个渲染区
    el.main.innerHTML = ''
    var wrap = document.createElement('div')
    wrap.id = 'cmpWrap'

    function mkPane(label, color, cnt) {
      var pane = document.createElement('div')
      pane.className = 'pane'
      var hd = document.createElement('div')
      hd.className = 'pane-hd'
      var dot = document.createElement('span'); dot.className = 'dot ' + color
      var t = document.createElement('span'); t.textContent = label
      var c = document.createElement('span'); c.className = 'cnt'; c.textContent = cnt
      hd.appendChild(dot); hd.appendChild(t); hd.appendChild(c)
      var sc = document.createElement('div')
      sc.className = 'pane-score'
      pane.appendChild(hd); pane.appendChild(sc)
      wrap.appendChild(pane)
      return sc
    }

    var scoreA = mkPane(diff.base + '（左）', 'red', diff.diffCount + ' 处改动标红')
    var scoreB = mkPane(diff.head + '（右）', 'green', diff.diffCount + ' 处改动标绿')
    el.main.appendChild(wrap)
    log('左右两个面板已建（' + diff.base + ' / ' + diff.head + '）', 'ok')
    log('  左栏容器 ' + scoreA.clientWidth + '×' + scoreA.clientHeight +
        '   右栏容器 ' + scoreB.clientWidth + '×' + scoreB.clientHeight)

    // ── 差异列表（可折叠）──
    var bar = document.createElement('div')
    bar.id = 'cmp'
    var hd = document.createElement('div'); hd.className = 'hd'
    hd.innerHTML = '<span><b>' + diff.diffCount + '</b> 处差异　' +
                   esc(diff.base) + ' ↔ ' + esc(diff.head) + '</span>'

    var list = document.createElement('div')
    list.className = 'body hide'
    var toggle = document.createElement('button')
    toggle.className = 'toggle'
    function setOpen(open) {
      list.className = 'body' + (open ? '' : ' hide')
      toggle.textContent = open ? '▼ 收起差异列表'
                                : '▲ 展开差异列表（' + diff.measures.length + ' 条）'
    }
    toggle.onclick = function () { setOpen(list.className.indexOf('hide') >= 0) }
    setOpen(false)
    hd.appendChild(toggle)
    bar.appendChild(hd)

    var rowsByMeasure = {}     // 小节 index → [行]
    // sel = 用户**点名点过**的那一行。
    //
    // ⚠️ 同一小节下可能有好几行（音符行 + 记号行），它们都挂在
    //    rowsByMeasure[小节] 里。原来 syncDiffList 固定取 rows[0] ——
    //    于是「播放中点记号行」之后，播放位置没变、onPosition 继续触发，
    //    高亮每次都被抢回 rows[0]（音符行），表现就是
    //    「点了记号行，列表自己跳到音符行」。
    //    记住用户点的那一行，同小节内优先保持它。
    var listCur = { v: -1, row: null, sel: null }
    diff.measures.forEach(function (m) {
      var row = document.createElement('div'); row.className = 'cmp-row'
      ;(rowsByMeasure[m.index] = rowsByMeasure[m.index] || []).push(row)
      var no = document.createElement('span'); no.className = 'no'
      // diff 里的 index 是 0 基，谱上印的号码在 number
      no.textContent = '第 ' + m.number + ' 小节'
      var who = document.createElement('span'); who.className = 'who'
      who.textContent = m.trackName || ''
      var body = document.createElement('span')
      var rm = m.removed.map(function (x) { return x.name }).join(' ')
      var ad = m.added.map(function (x) { return x.name }).join(' ')
      body.innerHTML = '<span class="rm">' + esc(rm) + '</span>' +
                       '<span class="arrow"> → </span>' +
                       '<span class="ad">' + esc(ad) + '</span>'
      row.appendChild(no); row.appendChild(who); row.appendChild(body)
      row.onclick = function () {
        // ⚠️ 整个处理器包起来。
        //    之前开头就是 `measureStartTick(state.apiA, ...)` ——
        //    只要 state 还是 null 或别的什么，就在**第一行**抛出，
        //    而 log 在它后面，所以表现是「点了毫无动静、日志里也没有」，
        //    完全看不出哪里错了。
        try {
          var tick = measureStartTick(apiA, m.index)
          // ⚠️⚠️ 只**定位**，不改变播放/暂停状态。
          //
          //    原来这里是 `apiA/B.tickPosition = tick` 紧跟 `curApi().play()` ——
          //    **无条件起播**。后果：
          //      · 暂停时点一条 → 突然开始响，得再按一次暂停
          //      · 正在播时点一条 → 从那一小节的起点重头播，节奏被打断
          //    点列表项是「带我去那儿看」，不是「开始播放」。
          //
          //    seekBothTo 正好是这个语义（点谱面用的也是它）：
          //    设位置本身不改播放状态 —— 正在播就从新位置续上，暂停就停在原地。
          var wasPlaying = false
          try { wasPlaying = curApi().playerState === 1 } catch (e2) {}
          seekBothTo(tick, '差异列表')
          log('跳到第 ' + m.number + ' 小节（' + (m.trackName || '') +
              '，tick ' + tick + '，当前听 ' + state.side + '，' +
              (wasPlaying ? '保持播放' : '保持暂停') + '）')
        } catch (e) {
          log('跳转失败：' + e.message, 'bad')
          return
        }

        // 显式把**两栏都滚到那一小节**。
        // 光设位置不够 —— 视图不会动，看着像"点了没反应"。
        try {
          var ra = scrollToMeasure(apiA, scoreA, m.index)
          var rb = scrollToMeasure(apiB, scoreB, m.index)
          log('  滚到第 ' + m.number + ' 小节：左=' + ra + ' 右=' + rb,
              (ra || rb) ? 'ok' : 'warn')
          listCur.sel = row        // 记住点的是这一行，别被播放跟随抢回去
          listCur.v = -1
          syncDiffList(curApi(), list, rowsByMeasure, listCur)
        } catch (e) {
          log('  滚动失败：' + e.message, 'bad')
        }
      }
      list.appendChild(row)
    })

    // ── 整声部空缺（另起一段）───────────────────────────────────
    // 摆最前面 —— 它改变的是"这个声部能不能比"，
    // 比具体某处的红绿框更根本。
    if ((diff.missingParts || []).length) {
      var mpSep = document.createElement('div')
      mpSep.className = 'cmp-sep warn'
      mpSep.textContent = '整声部空缺（' + diff.missingParts.length
        + ' 个：一侧整曲无内容，可能没扒 —— 未逐音符比较）'
      list.appendChild(mpSep)
      diff.missingParts.forEach(function (m) {
        var row = document.createElement('div')
        row.className = 'cmp-row missing'
        var no = document.createElement('span'); no.className = 'no'
        no.textContent = m.emptySide === 'A' ? diff.base : diff.head
        var who = document.createElement('span'); who.className = 'who'
        who.textContent = m.name
        var body = document.createElement('span')
        body.className = 'mkbody'
        var have = m.emptySide === 'A' ? m.notesB : m.notesA
        body.textContent = '整曲无内容，另一侧 ' + have + ' 个音'
        row.appendChild(no); row.appendChild(who); row.appendChild(body)
        list.appendChild(row)
      })
    }

    // ── 记号差异（另起一段）─────────────────────────────────────
    // 单列一段而不是混在音符差异里 —— 性质不同：
    // 音符差异指向具体的音符头，记号差异是"这一小节整体有变化"。
    if (diff.marks && (diff.marks.markCount || 0)) {
      var mkRows = []
        .concat((diff.marks.marks || []).map(function (m) {
          return { index: m.index, number: m.number, who: '记号', items: m.items }
        }))
        .concat((diff.marks.partMarks || []).map(function (m) {
          return { index: m.index, number: m.number, who: m.trackName || '记号', items: m.items }
        }))
      mkRows.sort(function (a, b) { return a.index - b.index })

      // ⚠️ 把「页面实际要显示什么」打出来。
      //    出现过「页面显示的和我生成的清单对不上」的情况，
      //    只能靠这个把两边的口径摆在一起比。
      if (DEBUG) {
        log('  记号清单（页面实际显示的 ' + mkRows.length + ' 条）：' +
            mkRows.map(function (r) {
              return '第' + r.number + '小节 ' + r.who + ' [' +
                (r.items || []).map(function (k) {
                  return k.kind + ' ' + k.from + '→' + k.to
                }).join('；') + ']'
            }).join('　｜　'))
        log('  记号清单原始来源：' + (diff.marks.source || '（无 source 字段）') +
            '　base=' + diff.marks.base + ' head=' + diff.marks.head +
            '　markCount=' + diff.marks.markCount)
      }

      var mkSep = document.createElement('div')
      mkSep.className = 'cmp-sep'
      mkSep.textContent = '记号差异（' + mkRows.length + ' 处：力度/速度/文字/连音线/跳音…）'
      list.appendChild(mkSep)

      mkRows.forEach(function (mk) {
        var row = document.createElement('div')
        row.className = 'cmp-row mark'
        ;(rowsByMeasure[mk.index] = rowsByMeasure[mk.index] || []).push(row)
        var no = document.createElement('span'); no.className = 'no'
        no.textContent = '第 ' + mk.number + ' 小节'
        var who = document.createElement('span'); who.className = 'who'
        who.textContent = mk.who
        var body = document.createElement('span')
        body.className = 'mkbody'
        body.textContent = (mk.items || []).map(function (k) {
          return k.kind + ' ' + k.from + '→' + k.to
        }).join('；')
        row.appendChild(no); row.appendChild(who); row.appendChild(body)
        row.onclick = function () {
          try {
            var tick = measureStartTick(apiA, mk.index)
            // ⚠️ 同上：只定位，不改变播放/暂停状态（原来是写死 curApi().play()）
            var wasPlaying = false
            try { wasPlaying = curApi().playerState === 1 } catch (e2) {}
            seekBothTo(tick, '记号条目')
            scrollToMeasure(apiA, scoreA, mk.index)
            scrollToMeasure(apiB, scoreB, mk.index)
            listCur.sel = row        // 同上：记住是记号行，别被抢回音符行
            listCur.v = -1
            syncDiffList(curApi(), list, rowsByMeasure, listCur)
            log('记号差异：跳到第 ' + mk.number + ' 小节（' +
                (wasPlaying ? '保持播放' : '保持暂停') + '）')
          } catch (e) { log('跳转失败：' + e.message, 'bad') }
        }
        list.appendChild(row)
      })
    }

    bar.appendChild(list)
    el.main.appendChild(bar)

    // ── 两个实例 ──
    function mkSettings(file) {
      return {
        core: {
          file: file,
          fontDirectory: 'vendor/',
          // 全部声部（默认只渲染第一个 —— 多乐器谱子会只显示一件乐器）
          tracks: 'all',
          // ⚠️ 必须关掉懒加载：分块渲染时没渲染的部分**没有 boundsLookup**，
          //    叠不了标记。
          enableLazyLoading: false,
          // ⚠️⚠️ 必须打开，否则 BoundsLookup 里**不含每个音符的位置**
          //    （默认出于性能考虑不收集），叠色时一个坐标都拿不到。
          includeNoteBounds: true,
        },
        display: Object.assign({}, piece.display ? Object.assign({}, DISPLAY, piece.display) : DISPLAY, {
          // ⚠️⚠️ 对比模式下**必须把每行小节数固定住**。
          //
          //   两个版本各自自动排版的话，每行装几个小节会不一样，
          //   于是「同一小节」在两边的行内位置不同 —— 滚动同步就永远
          //   差最多一行（实测验算：A 第 20 小节在第 20-23 行的中间，
          //   B 第 20 小节却在第 18-20 行的末尾，按行内比例落下去对不上）。
          //
          //   固定成同一个值之后，两边的行结构完全一致，
          //   按「行 + 行内比例」同步就是精确的。
          //   ?bars=N 可以改（默认 4）。
          barsPerRow: numParam('bars', 4),
        }),
        player: {
          enablePlayer: true,
          // ⚠️⚠️ playerMode 是**另一个**开关，默认是 Disabled(0)。
          //    光标建不建靠 `playerMode !== Disabled && enableCursor`
          //    （见 min.js 的 get _y()）。只设 enablePlayer 不够 ——
          //    实测光标不出现。
          //    1 = EnabledAutomatic（有伴奏轨就用，否则用合成器）
          playerMode: 1,
          // ⚠️ 必须 sf2。sf3 会被 AlphaTab 静默拒绝（一个事件都不触发）。
          soundFont: 'vendor/sonivox.sf2',
          scrollElement: scoreA,
          // 对比模式是双实例，默认避开 AudioWorklet 的竞态问题
          outputMode: outputMode(true),
          // ⚠️ 关掉内置的「点击谱面跳转」—— 它只管自己被点的那一个实例。
          //    左右并排需要「点哪边都跳两边」，所以自己处理 beatMouseDown。
          enableUserInteraction: false,
          // 播放光标。默认就是开的，这里显式写出来 —— 对比模式下
          // 曾经因为没写而看不见光标，排查时全靠这两行确认状态。
          enableCursor: true,
          enableAnimatedBeatCursor: true,
          enableElementHighlighting: true,
          // ⚠️ **永远 0** —— AlphaTab 的自动滚动一旦开过就关不干净：
          //    实测「开一次 → 再关 → 点任何按钮都往下滚，而且不是滚到光标」。
          //    所以不用它的，自动滚动由 scrollToCursor() 自己实现。
          scrollMode: 0,
        },
      }
    }

    var apiA = null, apiB = null
    try {
      apiA = new alphaTab.AlphaTabApi(scoreA, mkSettings(piece.file))
      log('实例 A 创建成功（' + piece.file + '，输出模式 ' +
          (outputMode(true) ? 'ScriptProcessor' : 'AudioWorklet') + '）', 'ok')
    } catch (e) { setHint('左栏初始化失败：' + e.message, true); return }
    try {
      var sb = mkSettings(piece.compareFile)
      sb.player.scrollElement = scoreB
      apiB = new alphaTab.AlphaTabApi(scoreB, sb)
      log('实例 B 创建成功（' + piece.compareFile + '）', 'ok')
    } catch (e) { setHint('右栏初始化失败：' + e.message, true); return }

    state = { apiA: apiA, apiB: apiB, diff: diff, scoreA: scoreA, scoreB: scoreB, mutes: { A: false, B: false } }
    setupZoom([apiA, apiB])
    zoom.onScrollToggle = applyScrollMode
    applyScrollMode()

    // ── 听哪一边：**单选** ──────────────────────────────────────────
    //
    // ⚠️ 为什么不做「两个都听」：
    //    两个 AlphaTab 实例各有自己的音频时钟和缓冲，apiA.play() 和
    //    apiB.play() 不是原子操作，中间差的那几毫秒/几十毫秒消不掉。
    //    同时播出来就是"乱七八糟" —— 实测如此。
    //    而且就算对得齐，两个版本重叠着听也分不清谁是谁。
    //
    //    所以同一时刻只让一个响，切换时从**同一个 tick** 续上，
    //    这样 A/B 对比是干净的。
    state.side = 'A'
    var listenBtns = {}

    function apiOf(k) { return k === 'A' ? state.apiA : state.apiB }
    function sideName(k) { return k === 'A' ? diff.base : diff.head }

    function paintSide() {
      Object.keys(listenBtns).forEach(function (k) {
        var b = listenBtns[k]
        var active = (k === state.side)
        b.textContent = (active ? '🔊 ' : '· ') + sideName(k)
        b.className = active ? 'on' : 'off'
      })
    }

    /** 切换听哪一版。**进度要从旧的那版交给新的那版。**
     *
     *  ⚠️ 这里的方向很容易写反。曾经写成「把原来那版拉到新版的位置」——
     *    结果就是切换后各自保持自己的进度，两边对不上。
     *    正确的顺序：切之前先记下当前 tick，切之后再设给新选中的那个。
     */
    function switchSide(k) {
      if (k === state.side) return
      var oldApi = apiOf(state.side)
      var tick = 0
      var wasPlaying = false
      try {
        tick = oldApi.tickPosition || 0
        wasPlaying = oldApi.playerState === 1
      } catch (e) {}
      if (wasPlaying) { try { oldApi.pause() } catch (e) {} }

      state.side = k
      applyScrollMode()          // 自动滚动跟着换边
      var newApi = apiOf(k)
      try { newApi.tickPosition = tick } catch (e) {}
      if (wasPlaying) { try { newApi.play() } catch (e) {} }
      if (state.hideGhost) state.hideGhost()   // 换边了，影子位置要重算
      paintSide()
      log('切换到「' + sideName(k) + '」，位置 ' + tick + ' tick' +
          (wasPlaying ? '（接着播）' : '（保持暂停）'))
    }
    state.switchSide = switchSide

    ;[['A', diff.base], ['B', diff.head]].forEach(function (pr) {
      var b = document.createElement('button')
      b.title = '切到这一版（从同一个位置接着听）'
      b.onclick = function () { switchSide(pr[0]) }
      listenBtns[pr[0]] = b
      el.listen.appendChild(b)
    })
    paintSide()
    el.listen.style.display = ''

    // ── 底部控制条 ──
    var totalMs = 0
    function syncUi() {
      var pos = (state.side === 'A' ? apiA : apiB).timePosition || 0
      if (!state.dragging) el.seek.value = String(Math.round(pos))
      el.time.textContent = fmt(pos) + ' / ' + fmt(totalMs)
      // ⚠️ 用【当前在播的那一边】判断，别写死 apiA ——
      //    否则听「改后」时按钮会错显示成「▶ 播放」。
      el.play.textContent = curApi().playerState === 1 ? '⏸ 暂停' : '▶ 播放'
    }
    state.syncUi = syncUi

    function curApi() { return state.side === 'A' ? state.apiA : state.apiB }
    function otherApi() { return state.side === 'A' ? state.apiB : state.apiA }

    /** 把两个实例都定位到同一 tick。
     *
     *  用途：在任意一边点谱面，两边一起跳 —— 这样你听到的那一版
     *  会跟着你点的地方走，而不是只有被点的那一版动了。
     *  （内置的开启状态下只管被点的那个实例，所以上面关掉了它。）
     */
    function seekBothTo(tick, from) {
      var on = curApi(), off = otherApi()
      var was = false
      try { was = on.playerState === 1 } catch (e) {}

      // ⚠️ **不要 pause → 设位置 → play。**
      //
      //    tickPosition 的 setter 和 play() 都是往 worker postMessage，
      //    是异步的。实测这么写时 play 会从「pause 时记住的位置」续上，
      //    把中间那条设位置吞掉 —— 表现是「点了进度条卡一下但不动，
      //    继续从原处播」。（暂停状态点则正常，因为没有 play 来覆盖。）
      //
      //    直接设位置就行：setter 会把 seek 消息发给 worker，
      //    正在播的话它会从新位置继续。
      try { on.tickPosition = tick; off.tickPosition = tick } catch (e) {
        log('设位置失败：' + e.message, 'bad')
      }

      // ⚠️ **暂停状态下设 tickPosition 不会触发 playerPositionChanged**，
      //    进度条也就不会动 —— 表现是「点了没反应，还停在原位」。
      //    所以这里手动刷一次 UI。
      try { syncUi() } catch (e) {}

      // 记下实际生效的值（可能和请求的不一样：AlphaTab 会吸附到最近的拍）
      var got = null
      try { got = on.tickPosition } catch (e) {}
      log('定位（' + from + '）→ 请求 ' + tick + ' tick，实际 ' + got +
          '（' + (was ? '接着播' : '保持暂停') + '）', got === tick ? undefined : 'warn')
    }
    state.seekBothTo = seekBothTo

    el.play.onclick = function () {
      var on = curApi()
      if (on.playerState === 1) {
        on.pause(); otherApi().pause()
        if (state.hideGhost) state.hideGhost()
        log('→ pause')
      } else {
        // 起播前把另一个对齐到同一位置（但它不出声）
        try { otherApi().tickPosition = on.tickPosition } catch (e) {}
        var ok = on.play()
        log('→ play ' + state.side + ' = ' + ok, ok ? 'ok' : 'warn')
      }
    }
    // 「停止」按钮去掉了。播放按钮本身就是播放/暂停切换。
    // 想回到开头：拖进度条到最左（进度条的处理里会同步两边位置）。
    el.seek.oninput = function () { state.dragging = true }
    el.seek.onchange = function () {
      var t = Number(el.seek.value)
      state.dragging = false
      var on = curApi(), off = otherApi()
      var was = false
      try { was = on.playerState === 1 } catch (e) {}
      // 和点谱面同理：不要 pause → 设位置 → play（play 会覆盖掉设的位置）
      try { on.timePosition = t; off.timePosition = t } catch (e) {}
      setTimeout(syncUi, 0)   // 设位置是异步的，稍后刷一次 UI
      log('进度条跳到 ' + fmt(t) + '（' + state.side + ' 在播：' + was + '）')
    }
    document.addEventListener('keydown', function (ev) {
      if (ev.code !== 'Space' || ev.target === el.seek) return
      ev.preventDefault()
      el.play.click()
    })

    // ── 滚动同步 ──
    //
    // 两个版本的排版不可能一样（小节宽度、每行几个小节都可能不同），
    // 所以**不能按像素比例同步**，得按乐谱结构对齐。
    //
    // 做法：读「视口顶部落在哪一小节、以及在该行内的比例」，
    // 在对面找到包含同一小节的那一行，按同样的比例落下去。
    //
    // 早期版本只按小节顶边对齐（scrollTop = 小节.realBounds.y），
    // 丢掉行内偏移 —— 慢慢滚时对面就是一格一格跳的，看着"不完全同步"。

    /** 读出「当前视口顶部」在乐谱里的位置。 */
    function readPos(api, scoreEl) {
      if (!api.boundsLookup) return null
      var y = scoreEl.scrollTop
      var systems = api.boundsLookup.staffSystems || []
      if (!systems.length) return null

      // ⚠️ 第一行**上面**还有一块——标题 / 作曲者那些 <credit>。
      //    它不属于任何一个 staffSystem，所以按行算比例时会掉进"第一行"
      //    的分支、frac 被夹成 0，对面就被拉到第一行顶边，标题被推出去 ——
      //    表现是「向上拉时一边有标题一边没有」。
      //
      //    所以：滚到第一行上方时，用**负比例**表达"比第一行高多少"，
      //    对面照着往回退同样的比例。两边的标题高度一样（同一份源文件），
      //    所以这样能对齐。
      var s0 = systems[0].realBounds
      if (s0 && y < s0.y) {
        var b0 = systems[0].bars || []
        return {
          firstBar: b0.length ? b0[0].index : 0,
          frac: s0.h > 0 ? (y - s0.y) / s0.h : 0,   // 负值
        }
      }

      for (var i = 0; i < systems.length; i++) {
        var rb = systems[i].realBounds
        if (!rb) continue
        var last = (i === systems.length - 1)
        if (y < rb.y + rb.h || last) {
          // 不再夹到 [0,1] —— 上面那个分支已经处理了负值，
          // 这里 y >= rb.y 所以本来就是非负的。
          var frac = rb.h > 0 ? (y - rb.y) / rb.h : 0
          var bars = systems[i].bars || []
          return { firstBar: bars.length ? bars[0].index : 0, frac: frac }
        }
      }
      return null
    }

    /** 把「某个小节 + 行内比例」落到对面的滚动位置上。 */
    function writePos(api, scoreEl, pos) {
      if (!api.boundsLookup || !pos) return null
      var systems = api.boundsLookup.staffSystems || []
      if (!systems.length) return null

      // 找包含 pos.firstBar 的那一行 —— 对面每行装的小节数可能不一样，
      // 所以按「小节落在哪一行的区间里」找，而不是按行号。
      var target = null
      for (var i = 0; i < systems.length; i++) {
        var bars = systems[i].bars || []
        if (!bars.length) continue
        var lo = bars[0].index
        var hi = bars[bars.length - 1].index
        if (pos.firstBar >= lo && pos.firstBar <= hi) { target = systems[i]; break }
        if (lo > pos.firstBar) { target = systems[i]; break }   // 落到了两行之间
      }
      if (!target) target = systems[systems.length - 1]

      var rb = target.realBounds
      if (!rb) return null
      // frac 可能是负的（在标题区），结果会小于 rb.y —— 正好把对面
      // 也退到它自己的标题区，两边就对齐了。
      var want = Math.round(rb.y + pos.frac * rb.h)
      scoreEl.scrollTop = want
      return want
    }

    // 回设抑制：自己设过去的滚动位置，反过来不要再触发一次同步，
    // 否则两边会互相推着抖。以前用一个 60ms 的锁，快滚时会丢事件 ——
    // 改成记住"我设了多少"，对面滚到这个值时忽略。
    var suppress = { A: null, B: null }
    function bindScroll(fromEl, fromApi, toEl, toApi, fromKey) {
      var queued = false
      var said = false

      fromEl.addEventListener('scroll', function () {
        // 这一步是对方设过来的，不是我滚的 → 忽略
        if (suppress[fromKey] !== null && Math.abs(fromEl.scrollTop - suppress[fromKey]) <= 1) {
          suppress[fromKey] = null
          return
        }
        suppress[fromKey] = null
        if (queued) return
        queued = true
        requestAnimationFrame(function () {
          queued = false
          var pos = readPos(fromApi, fromEl)
          if (!pos) return
          var toKey = fromKey === 'A' ? 'B' : 'A'
          var set = writePos(toApi, toEl, pos)
          if (set !== null) suppress[toKey] = set
          if (DEBUG && (!said || said < 4)) {
            said = (said || 0) + 1
            log('同步 ' + fromKey + '→' + toKey + '：小节 ' + pos.firstBar +
                ' 比例 ' + pos.frac.toFixed(2) + ' → 对面滚到 ' + set)
          }
          if (!said && DEBUG) {
            said = 1
            log('滚动同步已接上（' + fromKey + ' 驱动，按行 + 行内比例）')
          }
        })
      }, { passive: true })
    }

    var drawnA = 0, drawnB = 0
    var posTicksA = 0, posTicksB = 0

    /** 位置事件统一处理。
     *
     *  ⚠️ 两边的处理必须**完全一样**，只是各管自己那一栏。
     *    之前 A 的处理器里写了自动滚动和列表跟随，B 的只写了 syncUi ——
     *    结果「选改后时不自动滚动，只有原版会」。
     *    两个实例是镜像的，任何只写一边的逻辑都会漏。
     */
    // ── 影子光标 ──────────────────────────────────────────────────
    // 画在**没在播的那一边**，位置取自**在播那边**的当前小节。
    var ghost = null
    function ghostHost(sc) {
      var c = sc.querySelector('.at-cursors')
      return (c && c.parentElement) || sc
    }

    /** 显示/隐藏某一栏的**真光标**。
     *
     *  ⚠️ 没在播的那一栏，AlphaTab 的光标仍然停在上次的位置上（静止的），
     *    跟我们的影子光标叠在一起会看着很乱。
     *    所以：哪一栏在用影子，就把它的真光标藏起来。
     */
    function setRealCursor(sc, on) {
      var c = sc.querySelector('.at-cursors')
      if (c) c.style.visibility = on ? '' : 'hidden'
    }
    function drawGhost(fromApi, toApi, toScore) {
      if (!fromApi || !toApi || !toApi.boundsLookup) return
      if (fromApi.playerState !== 1) { hideGhost(); return }

      var tick = 0
      try { tick = fromApi.tickPosition } catch (e) { return }
      var bars = (fromApi.score && fromApi.score.masterBars) || []
      var idx = 0
      for (var i = 0; i < bars.length; i++) {
        if (bars[i].start <= tick) idx = i
        else break
      }
      var mb = toApi.boundsLookup.findMasterBarByIndex(idx)
      if (!mb) return
      // lineAlignedBounds 是「正好贴着谱线」的那一圈，画光标最合适
      var b = mb.lineAlignedBounds || mb.realBounds
      if (!b) return

      var host = ghostHost(toScore)
      if (!ghost || ghost.parentNode !== host) {
        if (ghost && ghost.parentNode) ghost.parentNode.removeChild(ghost)
        ghost = document.createElement('div')
        ghost.className = 'om-ghost-cursor'
        host.appendChild(ghost)
      }
      ghost.style.display = ''
      ghost.style.left = b.x + 'px'
      ghost.style.top = b.y + 'px'
      ghost.style.width = b.w + 'px'
      ghost.style.height = b.h + 'px'
      setRealCursor(toScore, false)      // 这一栏用影子，真光标藏起来
    }
    function hideGhost() {
      if (ghost) ghost.style.display = 'none'
      // 影子收起来，真光标恢复（否则暂停后那一栏就彻底没指示了）
      setRealCursor(scoreA, true)
      setRealCursor(scoreB, true)
    }
    state.hideGhost = hideGhost

    function onPosition(side, a, sc) {
      if (state.side !== side) return       // 只有当前在播的那一边才动
      setRealCursor(sc, true)               // 在播这一栏用真光标
      syncUi()
      scrollToCursor(a, sc)
      syncDiffList(a, list, rowsByMeasure, listCur)
      // 影子光标：从在播这边读位置，画到另一边
      drawGhost(a, otherApi(), side === 'A' ? scoreB : scoreA)
    }
    var boundA = false, boundB = false   // 滚动监听只挂一次

    /** 按「哪一边在播」分配自动滚动。
     *
     *  只有正在播的那一边主动滚动，另一边始终 scrollMode 0。
     *
     *  为什么要限制：两边都开的话，任何让另一边位置变化的操作
     *  （切换时设 tickPosition）都会让它自己滚一截，而滚动同步
     *  又把这个滚动传给在播那边 —— 表现是「每按一次按钮两边都往下蹿」。
     *  只留一边有滚动权，就不会互相推。
     */
    // AlphaTab 的 scrollMode 恒为 0（见 mkSettings 注释），
    // 所以这里不再改它的设置。换边时只要让 scrollToCursor 认新的在播方
    // 即可 —— 它每次都用 curApi() 取。
    function applyScrollMode() {
      log('自动滚动：' + (AUTO_SCROLL ? '开（' + state.side + ' 在播时生效）' : '关'))
    }
    state.applyScrollMode = applyScrollMode

    // 不做「光标镜像」。
    //
    // 原本想让没在播的那一边也有光标，做法是把在播那边的 tick 定期
    // 同步过去。但设位置会让那一边**自己的自动滚动**触发，滚一截；
    // 滚动同步又把在播那边带着滚 —— 表现是「每按一次按钮两边都往下蹿」。
    //
    // 试过只给在播那边滚动权（能压住大部分），但设位置本身仍可能
    // 引发一次 scrollIntoView。所以干脆不做：
    // **光标只在在播的那一边出现**，这也符合直觉 —— 声音在哪边，光标在哪边。
    // 缩放一开始就调用：立刻抹掉旧标注（见 applyZoom 的注释）
    zoom.clearMarks = function () {
      clearDiff(scoreA); clearDiff(scoreB)
      if (state.hideGhost) state.hideGhost()
    }

    // 缩放后延迟重画的兜底（见 applyZoom）
    zoom.redraw = function () {
      if (!diff) return
      if (state.hideGhost) state.hideGhost()   // 重排后坐标变了，影子先收掉
      clearDiff(scoreA); clearDiff(scoreB)
      drawnA = drawDiff(apiA, diff, scoreA, 'base', 0)
      drawnB = drawDiff(apiB, diff, scoreB, 'head', 0)
      log('缩放后重画：左 ' + drawnA + ' 处，右 ' + drawnB + ' 处',
          (drawnA && drawnB) ? 'ok' : 'warn')
    }
    regAll(apiA, {
      scoreLoaded: function () { log('A scoreLoaded ✅', 'ok') },
      soundFontLoaded: function () {
        log('A 音源就绪', 'ok')
        totalMs = apiA.endTime || 0
        el.seek.max = String(Math.max(1, Math.round(totalMs)))
        el.time.textContent = fmt(0) + ' / ' + fmt(totalMs)
      },
      playerPositionChanged: function () {
        onPosition('A', apiA, scoreA)
        if (posTicksA++ === 0) reportCursor(scoreA, '左·播放中')
      },
      playerFinished: function () { el.play.textContent = '▶ 播放'; el.seek.value = '0' },
      settingsUpdated: function () { log('A settingsUpdated（重排开始）') },
      beatMouseDown: function (beat) {
        if (beat && typeof beat.absoluteDisplayStart === 'number') {
          seekBothTo(beat.absoluteDisplayStart, diff.base)
        }
      },
      // ⚠️ 用 postRenderFinished：renderFinished 触发时 boundsLookup 还是 null
      postRenderFinished: function () {
        reportCursor(scoreA, '左·渲染后')
        drawnA = drawDiff(apiA, diff, scoreA, 'base', 0)
        log('左栏渲染完 · 标红 ' + drawnA + ' 处 · 容器 ' +
            scoreA.clientWidth + '×' + scoreA.clientHeight, drawnA ? 'ok' : 'warn')
        // ⚠️ 第 5 个参数是「抑制键」，必须是 'A'/'B' 这种纯标识。
        //    （曾经传 'A→B'，而函数里拿它当 suppress 的键用，
        //     于是抑制记错了对象，两边互相推 —— 表现是完全不同步）
        if (!boundA) { boundA = true; bindScroll(scoreA, apiA, scoreB, apiB, 'A') }
      },
      error: function (e) { log('A error ' + (e && e.message || e), 'bad') },
    })

    regAll(apiB, {
      scoreLoaded: function (sc) {
        log('B scoreLoaded ✅ ' + (sc && sc.masterBars ? sc.masterBars.length : '?') + ' 小节 · ' +
            ((sc && sc.tracks) || []).length + ' 个声部', 'ok')
      },
      soundFontLoaded: function () { log('B 音源就绪', 'ok') },
      settingsUpdated: function () { log('B settingsUpdated（重排开始）') },
      beatMouseDown: function (beat) {
        if (beat && typeof beat.absoluteDisplayStart === 'number') {
          seekBothTo(beat.absoluteDisplayStart, diff.head)
        }
      },
      postRenderFinished: function () {
        reportCursor(scoreB, '右·渲染后')
        drawnB = drawDiff(apiB, diff, scoreB, 'head', 0)
        log('右栏渲染完 · 标绿 ' + drawnB + ' 处 · 容器 ' +
            scoreB.clientWidth + '×' + scoreB.clientHeight, drawnB ? 'ok' : 'warn')
        if (!boundB) { boundB = true; bindScroll(scoreB, apiB, scoreA, apiA, 'B') }
      },
      playerPositionChanged: function () {
        onPosition('B', apiB, scoreB)
        if (posTicksB++ === 0) reportCursor(scoreB, '右·播放中')
      },
      error: function (e) { log('B error ' + (e && e.message || e), 'bad') },
    })

    log('对比模式就绪：' + diff.diffCount + ' 处差异', 'ok')
  }

  // ═════════════════════════════════════════════════════════════════
  //  缩放
  //
  //  AlphaTab 的缩放是改 display.scale，然后 updateSettings() 让它生效，
  //  再 render() 触发重排 —— 三个都要，少一个都不会重新排。
  //
  //  对比模式下两个实例要一起改，否则两边字号不一致，行结构也会错开。
  // ═════════════════════════════════════════════════════════════════

  var zoom = { apis: [], base: 1, mult: 1, box: null, val: null }

  function applyZoom() {
    if (!zoom.val) return
    var s = zoom.base * zoom.mult
    zoom.val.textContent = Math.round(zoom.mult * 100) + '%'

    // ⚠️ **先清掉旧标注，再改缩放。**
    //    重排是异步的，不清的话那 200~250ms 里旧标注还留在**旧坐标**上
    //    （音符头已经放大、框还按原尺寸待在原处），看着像「重绘有延迟」。
    if (zoom.clearMarks) {
      try { zoom.clearMarks() } catch (e) { log('清旧标注失败：' + e.message, 'bad') }
    }

    zoom.apis.forEach(function (api) {
      if (!api || !api.settings || !api.settings.display) return
      try {
        api.settings.display.scale = s
        api.updateSettings()
        if (typeof api.render === 'function') api.render()
      } catch (e) { log('改缩放失败：' + e.message, 'bad') }
    })
    log('缩放 ' + Math.round(zoom.mult * 100) + '%（scale=' + s.toFixed(3) + '）' +
        '　应用到 ' + zoom.apis.length + ' 个实例')

    // 标记的像素偏移跟着缩放走
    zoomRatio = zoom.mult
    // 重排是异步的：postRenderFinished 会重画一次，这里再补一次兜底
    // （坐标可能比那个事件晚一拍才更新）
    if (zoom.redraw) setTimeout(zoom.redraw, 250)
  }

  function setupZoom(apis) {
    zoom.apis = apis.filter(Boolean)
    if (!zoom.apis.length) return
    // 基准 = 实例当前的 scale（来自 pieces.json 的 display 或页面默认值）
    var a0 = zoom.apis[0]
    zoom.base = (a0.settings && a0.settings.display && a0.settings.display.scale) || 1
    zoom.mult = 1

    if (!zoom.box) {
      zoom.box = document.getElementById('zoom')
      zoom.val = document.getElementById('zVal')
      document.getElementById('zIn').onclick = function () {
        zoom.mult = Math.min(3, zoom.mult * 1.15); applyZoom()
      }
      document.getElementById('zOut').onclick = function () {
        zoom.mult = Math.max(0.3, zoom.mult / 1.15); applyZoom()
      }
      zoom.val.onclick = function () { zoom.mult = 1; applyZoom() }

      // 自动滚动开关：scrollMode 1=跟光标滚，0=不滚
      var sc = document.getElementById('zScroll')
      function paintScroll() {
        sc.className = AUTO_SCROLL ? '' : 'off'
        sc.title = AUTO_SCROLL ? '播放时自动滚动：开（点一下关掉）'
                               : '播放时自动滚动：关（点一下打开）'
      }
      sc.onclick = function () {
        AUTO_SCROLL = !AUTO_SCROLL
        paintScroll()
        // 各模式自己决定怎么应用：
        //   单曲/摞叠：所有实例一起改
        //   左右并排：只给「在播的那一边」开，另一边始终关
        //             （见 applyScrollMode 的注释）
        // AlphaTab 的 scrollMode 恒为 0，所以这里只要改全局变量即可 ——
        // 滚动由 scrollToCursor() 按 AUTO_SCROLL 决定做不做。
        // （不再去动 AlphaTab 的设置，避免它的内部状态被"开过"之后关不干净）
        if (zoom.onScrollToggle) zoom.onScrollToggle()
        log('自动滚动：' + (AUTO_SCROLL ? '开' : '关'))
      }
      paintScroll()
    }
    applyZoom()
  }

  // ═════════════════════════════════════════════════════════════════
  //  单曲模式
  // ═════════════════════════════════════════════════════════════════

  function showPlayer(piece) {
    el.title.textContent = piece.title || piece.id
    el.sub.textContent = '乐谱播放'
    el.back.style.display = ''
    el.footer.style.display = ''
    el.listen.style.display = 'none'
    document.title = (piece.title || piece.id) + ' — OpenMuse'

    el.main.innerHTML = ''
    var score = document.createElement('div')
    score.id = 'score'
    el.main.appendChild(score)

    var api = null
    var wantPlay = false, totalMs = 0, dragging = false, posTicks = 0

    el.play.onclick = function () {
      if (!api) return
      if (api.playerState === 1) { api.pause(); return }
      wantPlay = true
      try { log('play() 返回 ' + api.play()) } catch (e) { log('play 异常 ' + e.message, 'bad') }
    }
    // 同上：没有独立的「停止」按钮了。
    el.seek.oninput = function () { dragging = true }
    el.seek.onchange = function () {
      if (!api) return
      var t = Number(el.seek.value)
      dragging = false
      // 不要 pause → 设位置 → play：play 是 postMessage 给 worker 的，
      // 会从 pause 的位置续上，把设的位置吞掉。直接设就行。
      try { api.timePosition = t } catch (e) {}
      setTimeout(syncUi, 0)
    }
    document.addEventListener('keydown', function (ev) {
      if (ev.code !== 'Space' || ev.target === el.seek) return
      ev.preventDefault(); el.play.click()
    })

    try {
      api = new alphaTab.AlphaTabApi(score, {
        core: {
          file: piece.file,
          fontDirectory: 'vendor/',
          tracks: 'all',
        },
        display: piece.display ? Object.assign({}, DISPLAY, piece.display) : DISPLAY,
        player: {
          enablePlayer: true,
          playerMode: 1,      // 见 mkSettings 的注释：光标依赖它
          soundFont: 'vendor/sonivox.sf2',
          scrollElement: score,
          outputMode: outputMode(false),
          enableCursor: true,
          enableAnimatedBeatCursor: true,
          scrollMode: 0,   // 见上面注释：改用自己实现的 scrollToCursor
        },
      })
      log('AlphaTabApi 创建成功（输出模式 ' + (outputMode(false) ? 'ScriptProcessor' : 'AudioWorklet') + '）', 'ok')
      setupZoom([api])
      zoom.onScrollToggle = null

      // ── 滚动探针 ────────────────────────────────────────────────
      // 「自动滚动关不掉」需要先弄清是谁在滚：是 AlphaTab（受 scrollMode
      // 控制）、还是我的同步代码、还是浏览器。所以滚动位置一变就报一次，
      // 同时报出 AlphaTab 当前认的 scrollMode。
      if (DEBUG) {
        var lastTop = -1, lastMode = null
        setInterval(function () {
          if (!api) return
          var t = Math.round(score.scrollTop)
          var m = (api.settings && api.settings.player) ? api.settings.player.scrollMode : '?'
          if (t !== lastTop || m !== lastMode) {
            log('滚动探查 scrollTop=' + t + '  scrollMode=' + m +
                '  playerState=' + api.playerState +
                '  autoScroll(AUTO_SCROLL)=' + AUTO_SCROLL, t !== lastTop ? 'warn' : undefined)
            lastTop = t; lastMode = m
          }
        }, 400)
      }
    } catch (e) {
      setHint('AlphaTab 初始化失败：' + e.message, true)
      return
    }

    function syncUi() {
      if (!api) return
      var pos = api.timePosition || 0
      if (!dragging) el.seek.value = String(Math.round(pos))
      el.time.textContent = fmt(pos) + ' / ' + fmt(totalMs)
      el.play.textContent = api.playerState === 1 ? '⏸ 暂停' : '▶ 播放'
      scrollToCursor(api, score)
      if (posTicks++ === 0) log('位置事件首次触发', 'ok')
    }

    regAll(api, {
      scoreLoaded: function (sc) {
        var n = sc && sc.masterBars ? sc.masterBars.length : '?'
        var all = (sc && sc.tracks) || []
        log('scoreLoaded ✅ ' + n + ' 小节 · ' + all.length + ' 个声部', 'ok')
        el.status.textContent = '音源加载中…'
      },
      soundFontLoaded: function () {
        log('音源就绪', 'ok')
        el.status.textContent = '就绪'
        totalMs = api.endTime || 0
        el.seek.max = String(Math.max(1, Math.round(totalMs)))
        el.time.textContent = fmt(0) + ' / ' + fmt(totalMs)
        if (wantPlay) { try { api.play() } catch (e) {} }
      },
      playerPositionChanged: syncUi,
      playerFinished: function () { el.play.textContent = '▶ 播放'; el.seek.value = '0' },
      error: function (e) { log('error ' + (e && e.message || e), 'bad') },
    })
  }

  // ═════════════════════════════════════════════════════════════════
  //  启动
  // ═════════════════════════════════════════════════════════════════

  var wantedId = params.get('piece')

  loadJson('pieces.json')
    .then(function (j) {
      var pieces = Array.isArray(j.pieces) ? j.pieces : []
      log('pieces.json 读到 ' + pieces.length + ' 首')

      if (!wantedId) {
        el.main.innerHTML = ''
        var wrap = document.createElement('div'); wrap.id = 'list'
        var h = document.createElement('h2'); h.textContent = pieces.length + ' 首曲子'
        wrap.appendChild(h)
        pieces.forEach(function (it) {
          var a = document.createElement('a')
          a.className = 'card'
          a.href = '?piece=' + encodeURIComponent(it.id) + (DEBUG ? '&debug' : '')
          a.innerHTML = '<div class="t">' + esc(it.title || it.id) +
                        (it.compareFile ? '<span class="badge">对照</span>' : '') + '</div>' +
                        '<div class="m">' + esc(it.file) + '</div>'
          wrap.appendChild(a)
        })
        el.main.appendChild(wrap)
        el.status.textContent = ''
        document.title = 'OpenMuse'
        return
      }

      var piece = pieces.filter(function (p) { return p.id === wantedId })[0]
      if (!piece) {
        setHint('找不到曲子「' + wantedId + '」', true)
        return
      }
      log('载入：' + (piece.title || piece.id))

      // 能对比 = 有差异清单 + 有对比版本的文件。
      // ⚠️ 这里曾经写成别的条件（判断和"哪种对比模式"混在一起），
      //    结果这一支永远进不来，页面直接退回普通播放页 ——
      //    表现是「打开对照却看到普通的单曲播放页」。
      //    现在只有一种对比模式（左右并排），条件就干净了。
      var canCompare = !!piece.compare && !!piece.compareFile

      if (canCompare) {
        // 对比模式：先把面板挂上占位，再去读差异清单 ——
        // 这样即使读失败也看得见原因，不会「什么都没出现」。
        el.main.innerHTML = ''
        var shell = document.createElement('div'); shell.id = 'cmp'
        var sh = document.createElement('div'); sh.className = 'hd'
        sh.textContent = '对比模式：正在读取差异清单…'
        shell.appendChild(sh); el.main.appendChild(shell)

        // 音符清单必备；记号清单可选（piece.marks）。
        // ⚠️ 记号单独一个文件、单独一个脚本产出 ——
        //    这样出问题时不会影响已经能用的音符对比。
        var jobs = [loadJson(piece.compare)]
        if (piece.marks) {
          jobs.push(loadJson(piece.marks).catch(function (e) {
            log('记号清单读取失败（忽略）：' + e.message, 'warn')
            return null
          }))
        }

        Promise.all(jobs)
          .then(function (res) {
            var diff = res[0], mk = res[1]

            // ⚠️ 先校验清单和条目是不是同一对文件 —— 挂错了就什么也别画。
            var bad = []
            if (!checkSource('音符清单', diff, piece)) bad.push('音符清单')
            if (mk && !checkSource('记号清单', mk, piece)) bad.push('记号清单')
            if (bad.length) {
              sh.innerHTML = '❌ ' + bad.join(' / ') + ' 与这个条目不是同一对文件，'
                + '拒绝渲染（画出来会是别的曲子的差异）。<br>'
                + '展开诊断面板看具体是哪两个文件名。'
              sh.style.color = '#ff6b6b'
              return
            }

            if (mk) diff.marks = mk
            var nm = diff.diffCount || 0
            var mm = mk ? (mk.markCount || 0) : 0
            var pm = diff.missingCount || 0
            log('读到 音符差异 ' + nm + ' 处，记号差异 ' + mm + ' 处，'
                + '整声部空缺 ' + pm + ' 个', (nm || mm || pm) ? 'ok' : 'warn')
            // ⚠️ **三样都要看**：音符差异、记号差异、整声部空缺。
            //    漏掉任何一个都会误报「完全一致」并 return，
            //    压根不进对比模式 —— 这个错犯过两次（先漏记号，又漏空缺）。
            if (!nm && !mm && !pm) { sh.textContent = '两个版本完全一致。'; return }
            showCompare(piece, diff)
          })
          .catch(function (e) {
            sh.textContent = '❌ 读差异清单失败：' + e.message
            sh.style.color = '#ff6b6b'
            log('读差异清单失败：' + e.message, 'bad')
          })
      } else {
        showPlayer(piece)
      }
    })
    .catch(function (e) {
      log('读 pieces.json 失败：' + e.message, 'bad')
      el.status.textContent = '出错'
      setHint('读 pieces.json 失败：' + e.message +
              '\n\n确认用 python3 serve.py 起服务（不是直接双击文件）。', true)
    })
})()
</script>

</body>
</html>
